/* MAGIC BATTLES v2 — animated adventure; original save key and data model retained */
.versionlabel{display:inline-flex;margin-left:9px;align-items:center;font-size:11px;color:#ffe6a5;border:1px solid #ffdf8f66;padding:3px 7px;border-radius:40px;vertical-align:middle}
.arena-scene{height:300px;position:relative;isolation:isolate;overflow:hidden;margin:19px 0 12px;border-radius:22px;border:2px solid #9483ff77;background:linear-gradient(165deg,#263c67,#2d2c62);box-shadow:inset 0 0 50px #ffffff12,0 17px 27px #09071b66}
.arena-scene:before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 22% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 73% 16%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 46% 36%,#fff7 0 3px,transparent 4px),radial-gradient(circle at 84% 44%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 15% 46%,#ffd97155,transparent 23%);background-size:220px 200px;animation:driftMagic 12s linear infinite;pointer-events:none}
.arena-scene:after{content:'';position:absolute;bottom:-65px;left:-10%;width:120%;height:145px;border-radius:50% 50% 0 0;background:linear-gradient(#7c76ac66,#1c244e);box-shadow:0 -11px 0 #a0ccbf30;z-index:0}
.arena-scene.forest{background:linear-gradient(160deg,#124a53,#224674 55%,#576a7d)}.arena-scene.forest:after{background:linear-gradient(#66a277,#21565e);box-shadow:0 -11px 0 #a3e2a244}
.arena-scene.volcano{background:linear-gradient(160deg,#49245b,#963850 68%,#be5b51)}.arena-scene.volcano:after{background:linear-gradient(#8d4646,#482852);box-shadow:0 -11px 0 #ffb66388}
.arena-scene.sky{background:linear-gradient(155deg,#276eaf,#7289ce 67%,#baa3dd)}.arena-scene.sky:after{background:linear-gradient(#c6c1e6,#6576aa);box-shadow:0 -11px 0 #ffffff6b}
.arena-scene.endless{background:linear-gradient(160deg,#1b1547,#443086 60%,#8c438b)}
.arena-scenery{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.8}
.arena-scenery .object{position:absolute;font-size:clamp(28px,5vw,47px);filter:drop-shadow(0 7px 2px #0b1b1e44);animation:sideSway 4s ease-in-out infinite alternate}
.arena-scenery .object:nth-child(1){left:3%;bottom:24%;animation-delay:-2s}.arena-scenery .object:nth-child(2){right:3%;bottom:24%}.arena-scenery .object:nth-child(3){right:21%;top:12%;font-size:34px;opacity:.85;animation-delay:-1s}
.actor{position:absolute;z-index:2;bottom:40px;width:39%;height:205px;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 15px 5px #05041a77)}
.actor:after{content:'';position:absolute;z-index:-1;bottom:-8px;width:75%;height:15px;border-radius:50%;background:#0a102255;filter:blur(5px)}
.player-actor{left:4%;animation:heroReady 2s ease-in-out infinite}
.enemy-actor{right:3%;animation:enemyReady 2.35s ease-in-out infinite;transform-origin:50% 80%}
.enemy-actor .beast{font-size:clamp(74px,12vw,115px);line-height:1;text-shadow:0 5px 18px #0006;display:block;transform:scaleX(-1)}
.enemy-actor.boss-actor .beast{font-size:clamp(95px,15vw,135px);filter:drop-shadow(0 0 18px #ffdd9a55)}
.actor .avatar-svg{height:190px;width:175px;max-width:100%;animation:none}
.player-actor.casting{animation:heroCast .82s cubic-bezier(.23,.82,.5,1) both}
.enemy-actor.struck{animation:monsterStruck .68s ease-in-out both}
.enemy-actor.lunging{animation:monsterLunge .64s ease-in-out both}
.player-actor.hurt{animation:heroHurt .65s ease-in-out both}
.arena-vs{position:absolute;top:23%;left:50%;transform:translateX(-50%);z-index:2;color:#ffe397;font-weight:1000;font-size:25px;text-shadow:0 2px 16px #161428}
.arena-name{position:absolute;bottom:10px;z-index:2;padding:5px 10px;border-radius:11px;background:#15172cbb;font-size:13px;font-weight:850;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arena-name.left{left:4%}.arena-name.right{right:4%}
.arena-pets{position:absolute;bottom:50px;left:27%;z-index:3;font-size:31px;display:flex;flex-direction:column;gap:0;pointer-events:none}.arena-pets span{animation:petFloat 1.7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 7px #10142b)}.arena-pets span:nth-child(2){animation-delay:-.7s}
.arena-pets.helping{animation:helperSurge .8s ease-out both}
.arena-projectile{position:absolute;left:29%;bottom:136px;z-index:4;width:39px;height:39px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#f8eb87 25%,#ff72d1 62%,#d34bff 72%,transparent 76%);box-shadow:0 0 21px 10px #f1b6ff,0 0 65px 20px #9bb9ff88;opacity:0;transform:scale(.3)}
.arena-projectile.flying{animation:spellTravel .72s ease-in forwards}
.arena-projectile.enemybolt{background:radial-gradient(circle,#fff 0 18%,#ffcf78 26%,#ff6868 60%,transparent 75%);box-shadow:0 0 20px 8px #ffb75d;left:72%;animation:enemyBolt .6s ease-in forwards}
.arena-damage{position:absolute;z-index:5;right:20%;top:25%;font-weight:1000;font-size:clamp(28px,5vw,48px);color:#fff5a2;text-shadow:0 2px #a64b82,0 5px 20px #000;opacity:0;pointer-events:none}
.arena-damage.show{animation:damageFloat .9s ease-out both}
.arena-damage.incoming{left:20%;right:auto;color:#ffb0bd}
.arena-scene.spell-flash{animation:arenaFlash .7s ease-out}
.battle-hp{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:5px 0 18px}.battle-hp .hp-card{padding:9px 12px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff25}
.battle-hp .healthtxt{font-size:12px;flex-wrap:wrap}.battle-hp .healthtxt span:last-child{font-variant-numeric:tabular-nums}
.safe-box{margin:18px 0;padding:17px;background:#56baaf16;border:1px solid #7de9dd77;border-radius:18px}.safe-box h3{margin:0 0 8px;color:#d0ffee}.safe-box p{margin:6px 0 12px;font-size:14px}.backup-status{color:#b4f2d4;font-size:13px}
.save-paste{width:100%;min-height:83px;border-radius:13px;border:1px solid #9c91d4;background:#161735;color:#fff;resize:vertical;font-size:12px;padding:10px;margin:10px 0}
.filepick{position:absolute;left:-99999px;width:1px;height:1px}
@keyframes driftMagic{to{transform:translateX(8%) translateY(-5%)}}
@keyframes sideSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes heroReady{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes enemyReady{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.025)}}
@keyframes heroCast{0%{transform:translate(0,0) scale(1)}28%{transform:translate(-15px,-13px) rotate(-8deg)}48%{transform:translate(38px,-18px) rotate(13deg) scale(1.09)}70%{transform:translate(17px,-9px) rotate(-2deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes monsterStruck{0%{transform:translate(0,0);filter:brightness(1)}28%{transform:translate(20px,-10px) rotate(13deg);filter:brightness(2.4)}55%{transform:translate(-8px,3px) rotate(-11deg);filter:brightness(1.6)}85%{transform:translate(7px,0) rotate(3deg)}100%{transform:translate(0,0);filter:brightness(1)}}
@keyframes monsterLunge{0%,100%{transform:translate(0,0)}30%{transform:translate(20px,-11px)}55%{transform:translate(-60px,-15px) scale(1.15)}80%{transform:translate(-6px,0)}}
@keyframes heroHurt{0%,100%{transform:translate(0,0)}30%{transform:translate(-17px,-9px) rotate(-9deg);filter:brightness(1.9)}55%{transform:translate(14px,0) rotate(7deg)}75%{transform:translate(-5px,0)}}
@keyframes spellTravel{0%{left:28%;bottom:130px;opacity:0;transform:scale(.35) rotate(0)}10%{opacity:1}70%{opacity:1;transform:scale(1.3) rotate(180deg)}100%{left:70%;bottom:136px;opacity:0;transform:scale(2.5) rotate(310deg)}}
@keyframes enemyBolt{0%{left:70%;bottom:138px;opacity:1;transform:scale(.6)}85%{opacity:1}100%{left:26%;bottom:125px;opacity:0;transform:scale(1.9)}}
@keyframes damageFloat{0%{opacity:0;transform:translateY(18px) scale(.5)}22%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-65px) scale(1)}}
@keyframes arenaFlash{0%,100%{filter:brightness(1)}55%{filter:brightness(1.34)}}
@keyframes helperSurge{0%{transform:translate(0,0) scale(1)}50%{transform:translate(48px,-35px) scale(1.35)}100%{transform:translate(0,0) scale(1)}}
@keyframes petFloat{from{transform:translateY(2px)}to{transform:translateY(-12px)}}
@media(max-width:480px){.arena-scene{height:250px}.actor{height:157px;bottom:34px}.actor .avatar-svg{height:157px;width:138px}.enemy-actor .beast{font-size:75px}.enemy-actor.boss-actor .beast{font-size:92px}.arena-pets{left:27%;bottom:43px;font-size:24px}.arena-name{font-size:11px}.battle-hp{gap:8px}.battle-hp .hp-card{padding:8px}}
@media(prefers-reduced-motion:reduce){.arena-projectile.flying,.arena-projectile.enemybolt,.arena-damage.show{animation:none!important;opacity:1}.arena-projectile{display:none}}

/* THE INFINITE ADVENTURES — original storybook exploration update */
:root{--paper:#fff2d6;--midnight:#121c39;--coral:#ffbd83}
body{background:radial-gradient(ellipse at 15% 0%,#546388 0%,transparent 52%),linear-gradient(150deg,#142c42,#242c4a 54%,#253e41);}
.shell{max-width:1200px}
.panel{border-color:#e8dbc43a;background:linear-gradient(155deg,#273953f5,#1f2c45f7);box-shadow:0 14px 45px #08162466}
.logo{background:linear-gradient(135deg,#ffb96e,#f06c85);font-size:31px}
.brand h1{font-size:clamp(22px,3vw,34px);letter-spacing:-.025em;color:#fff1d1}
.eyebrow{color:#9eeadf}
.btn{background:linear-gradient(120deg,#ffe2a4,#ffad81)}
.btn.purple{background:linear-gradient(120deg,#d4cdf8,#a8c7ee)}
.btn.teal{background:linear-gradient(120deg,#b2efcc,#8ee4dd)}
.btn:focus-visible{outline-color:#fff}
.explore-scene{position:relative;overflow:hidden;border-radius:22px;border:3px solid #fff0c985;background:#7fbab7;box-shadow:inset 0 0 30px #fff6,0 12px 25px #0a173c66;margin:15px 0 10px}
.explore-scene canvas{display:block;width:100%;height:auto;aspect-ratio:960/520;touch-action:manipulation;cursor:crosshair}
.explore-hud{position:absolute;left:12px;top:12px;z-index:2;max-width:75%;background:#182c42d9;border:1px solid #fff5;border-radius:13px;color:#fdf5e5;padding:9px 12px;font-size:12px;font-weight:800;text-shadow:0 1px 4px #0005;pointer-events:none}
.explore-help{color:#e6ecdc;font-size:13px;line-height:1.5}
.move-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:5px;justify-content:center;touch-action:none;margin:0 0 7px}
.move-pad button{border:2px solid #fff8;border-radius:14px;background:linear-gradient(145deg,#bdeddd,#7ab4bc);color:#193e4d;box-shadow:0 4px #36536c;font-size:23px;font-weight:950;touch-action:none;user-select:none}
.move-pad button:active{transform:translateY(3px);box-shadow:0 1px #36536c}
.move-pad .up{grid-column:2;grid-row:1}.move-pad .left{grid-column:1;grid-row:2}.move-pad .down{grid-column:2;grid-row:2}.move-pad .right{grid-column:3;grid-row:2}
.explore-ui{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.miniquest{background:#c9e8db17;border:1px solid #c9e8db55;border-radius:15px;padding:12px 14px;flex:1;min-width:200px}
.miniquest strong{color:#ffe8a7}
.puzzle-card{margin:20px 0 12px;background:linear-gradient(135deg,#30466a,#2a345e);border:2px solid #aec9e677;border-radius:19px;padding:20px;text-align:center}

 }
 if(kind==='verbal'){
  const pair=[['Bird','nest','Bee','hive','pond','desk','car'],['Fish','water','Bird','sky','shoe','book','hat'],['Puppy','dog','Kitten','cat','fish','rock','tree'],['Day','sun','Night','moon','apple','kite','shoe'],['Hand','glove','Foot','sock','cup','plate','hat'],['Chef','kitchen','Teacher','classroom','river','cave','forest'],['Rain','umbrella','Sun','sunglasses','mittens','sled','towel']][rand(0,6)];

 <section class="safe-box"><h3>💾 Back Up Your Adventure</h3><p>This downloads a small save file containing your level, pets, equipment, and character. Keep it safe with your dad.</p><div class="row"><button class="btn teal" data-do="export">⬇️ Download My Save</button><label for="import-file" class="btn purple" style="cursor:pointer;display:inline-flex;align-items:center">⬆️ Restore a Save</label><input id="import-file" class="filepick" type="file" accept=".json,application/json"/></div>
 <p class="backup-status">✅ Works with your original Magic Battles save. Importing never deletes the backup file.</p>
 <details><summary style="cursor:pointer;font-weight:850;padding:8px 0">Have save text from the original Chrome tab?</summary><p>Paste the saved JSON below. Ask Dad for help if needed.</p><textarea class="save-paste" id="save-paste" placeholder="Paste the original save JSON here"></textarea><button class="btn teal smallbtn" data-do="paste-save">✨ Restore Pasted Save</button></details>
 </section><div class="row"><button class="btn ghost smallbtn" data-do="sound">${S.soundOn?'🔊 Sound: On':'🔇 Sound: Off'}</button></div>
 <div class="buttonrow"><button class="btn purple" data-do="home">← Keep Playing</button><button class="btn ghost" data-do="reset">🗑️ Reset My Adventure</button></div><p class="tiny danger">Reset erases this browser's progress. Download a backup before using it.</p></section>`}
function downloadSave(){
 try{save();const text=JSON.stringify({game:'jacks-magic-battles',format:1,exportedAt:new Date().toISOString(),save:S},null,2);
 const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`infinite-adventures-save-level-${S.level}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Your adventure backup is downloading! 💾');}
 catch(e){toast('Could not download. Try Chrome on your computer.')}
}
function validateSave(obj){
 const value=obj?.game==='jacks-magic-battles'&&obj.save?obj.save:obj;
 if(!value||typeof value!=='object'||Array.isArray(value)||!value.avatar||typeof value.avatar.name!=='string'||!Number.isInteger(value.level)||value.level<1||value.level>100000||!Number.isInteger(value.completed)||value.completed<0||value.completed>1000000||!Array.isArray(value.pets)||value.pets.length>30000||!Array.isArray(value.equipped)||!Array.isArray(value.loot)||!Number.isInteger(value.bossWins)||value.bossWins<0||value.bossWins>1000000)throw Error('This file does not look like a Jack’s Magic Battles save.');
 const clean={...INITIAL(),...value,walkPos:value.walkPos||{},reasoning:{...INITIAL().reasoning,...value.reasoning},avatar:{...INITIAL().avatar,...value.avatar}};
 clean.avatar.name=String(clean.avatar.name).slice(0,16);
 clean.zone=Number.isInteger(clean.zone)?Math.max(0,Math.min(ZONES.length-1,clean.zone)):0;clean.realism=Number.isFinite(Number(clean.realism))?Math.max(0,Math.min(100,Number(clean.realism))):30;
 clean.screen=['creator','tutorial','battle','victory','reward','map','pets','settings','adventure','defeat'].includes(clean.screen)?clean.screen:'adventure';
 if(clean.screen==='battle'&&(!clean.battle||!clean.question))clean.screen='adventure';if(clean.battle){clean.battle.fallenPets=clean.battle.fallenPets||[];clean.battle.activePet=clean.battle.activePet||null;}
 clean.equipped=clean.equipped.filter(x=>clean.pets.some(p=>p.id===x)).slice(0,2);
 return clean;
}
function importSave(text){
 try{if(text.length>5_000_000)throw Error('Save too large.');const candidate=validateSave(JSON.parse(text));
 if(S.started&&!window.confirm(`Restore ${candidate.avatar.name}'s Level ${candidate.level} adventure? This will replace this browser's current Level ${S.level} save. Download a backup first if you want to keep both.`))return;
 S=candidate;save();render();beginMusicFromGesture();toast(`Save restored! Welcome back, ${S.avatar.name}! ⭐`);
 }catch(e){toast('Could not restore: '+e.message);}
}
function render(){stopExplore();syncMusic();let main;if(!S.started)main=creator();else if(S.screen==='tutorial')main=tutorial();else if(S.screen==='battle')main=battle();else if(S.screen==='victory')main=victory();else if(S.screen==='reward')main=reward();else if(S.screen==='defeat')main=defeat();else if(S.screen==='map')main=worldmap();else if(S.screen==='pets')main=pets();else if(S.screen==='settings')main=settings();else main=adventure();el().innerHTML=header()+(S.started?`<div style="margin-bottom:16px">${toolbar()}</div>`:'')+`<main class="layout ${S.screen==='battle'?'layout-battle':''}">${main}${S.started&&S.screen!=='battle'?sidebar():''}</main><div class="footnote">The Infinite Adventures • Original cartoon world • Your adventure saves automatically • Backup in Settings</div>`;if(S.started&&S.screen==='adventure')requestAnimationFrame(startExplore);}
function goHome(){if(S.battle){S.screen='battle'}else if(!S.tutorialDone){S.screen='tutorial'}else if(S.screen==='reward'){return}else if(S.screen==='defeat'){S.hp=S.maxHp;S.screen='adventure'}else S.screen='adventure';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do,v=b.dataset.value;switch(a){case'choose':{const key=b.dataset.key;if(!['skin','hair','style','robe'].includes(key))return;S.avatar[key]=Number(v);const i=document.getElementById('hero-name');if(i)S.avatar.name=i.value.slice(0,16);save();render();break}case'start':{const i=document.getElementById('hero-name');if(!i?.value.trim()){toast('Choose a name for your hero first! ✨');i?.focus();return;}S.avatar.name=i.value.trim().slice(0,16);S.started=true;S.screen='tutorial';save();render();beginMusicFromGesture();break}case'retry':{const opponent=S.retryOpponent;S.hp=S.maxHp;tryFight(Boolean(opponent?.isPractice),opponent);break}case'recover':S.hp=S.maxHp;S.screen=S.tutorialDone?'adventure':'tutorial';save();render();break;case'practice':tryFight(true);break;case'fight':tryFight(false);break;case'puzzle':answerPuzzle(Number(v));break;case'home':goHome();break;case'map':S.screen='map';save();render();break;case'pets':S.screen='pets';save();render();break;case'settings':S.screen='settings';save();render();break;case'look':S.screen='settings';save();render();document.getElementById('look-lab')?.scrollIntoView({behavior:'smooth',block:'center'});break;case'continue':S.screen=unlocked()>S.zone?'map':'adventure';save();render();break;case'travel':{const i=Number(v);if(i>unlocked()){toast('Beat more bosses to unlock that place!');break}if(S.battle){toast('Finish your current battle first!');S.screen='battle';render();break}S.zone=i;S.screen='adventure';save();render();break}case'equip':{const id=v;if(!S.pets.some(p=>p.id===id))return;const at=S.equipped.indexOf(id);if(at>=0)S.equipped.splice(at,1);else if(S.equipped.length<2)S.equipped.push(id);else {toast('You can equip only 2 pets! Unequip one first.');return}save();render();break}case'reward':{if(S.screen!=='reward')return;const r=getRewards().find(x=>x.id===v);if(!r)return;if(r.id==='blade')S.attackBonus+=r.value;else if(r.id==='armor')S.armor+=r.value;else if(r.id==='heart'){S.maxHp+=r.value;S.hp=S.maxHp}S.loot.push({name:r.name,id:r.id,value:r.value});S.notice=`You earned ${r.name}! Your next magical adventure awaits.`;S.screen='victory';save();render();break}case'export':downloadSave();break;case'paste-save':{importSave(document.getElementById('save-paste')?.value.trim()||'');break}case'sound':S.soundOn=!S.soundOn;save();render();break;case'music':S.musicOn=!S.musicOn;save();syncMusic();if(S.musicOn)beginMusicFromGesture();render();break;case'reset':{if(window.confirm('DANGER: Reset ALL levels, pets, and gear? Download a backup first.')){S=INITIAL();save();render()};break}}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('File is too large.');importSave(await file.text())}catch(err){toast('Could not read save file: '+err.message)}e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='math-form'){e.preventDefault();mathSubmit()}});
document.addEventListener('input',e=>{
 if(e.target.id==='hero-name'){S.avatar.name=e.target.value.slice(0,16);save();}
 if(e.target.id==='music-volume'){S.musicVolume=Math.max(0,Math.min(100,Number(e.target.value)||0));document.getElementById('music-volume-number').textContent=S.musicVolume+'%';save();syncMusic();}
 if(e.target.id==='realisticness-bar'){
  S.realism=Math.max(0,Math.min(100,Number(e.target.value)||0));save();
  document.getElementById('realism-number').textContent=Math.round(S.realism)+'%';
  document.getElementById('look-state').textContent=realismLabel();
  document.getElementById('look-previews').innerHTML=realismPreviews();
 }
});
render();
})();
</script></body></html>
