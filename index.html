/* MAGIC BATTLES v2 — animated adventure; original save key and data model retained */
.versionlabel{display:inline-flex;margin-left:9px;align-items:center;font-size:11px;color:#ffe6a5;border:1px solid #ffdf8f66;padding:3px 7px;border-radius:40px;vertical-align:middle}
.arena-scene{height:300px;position:relative;isolation:isolate;overflow:hidden;margin:19px 0 12px;border-radius:22px;border:2px solid #9483ff77;background:linear-gradient(165deg,#263c67,#2d2c62);box-shadow:inset 0 0 50px #ffffff12,0 17px 27px #09071b66}
.arena-scene:before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 22% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 73% 16%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 46% 36%,#fff7 0 3px,transparent 4px),radial-gradient(circle at 84% 44%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 15% 46%,#ffd97155,transparent 23%);background-size:220px 200px;animation:driftMagic 12s linear infinite;pointer-events:none}
.arena-scene:after{content:'';position:absolute;bottom:-65px;left:-10%;width:120%;height:145px;border-radius:50% 50% 0 0;background:linear-gradient(#7c76ac66,#1c244e);box-shadow:0 -11px 0 #a0ccbf30;z-index:0}
.arena-scene.forest{background:linear-gradient(160deg,#124a53,#224674 55%,#576a7d)}.arena-scene.forest:after{background:linear-gradient(#66a277,#21565e);box-shadow:0 -11px 0 #a3e2a244}
.arena-scene.volcano{background:linear-gradient(160deg,#49245b,#963850 68%,#be5b51)}.arena-scene.volcano:after{background:linear-gradient(#8d4646,#482852);box-shadow:0 -11px 0 #ffb66388}
.arena-scene.sky{background:linear-gradient(155deg,#276eaf,#7289ce 67%,#baa3dd)}.arena-scene.sky:after{background:linear-gradient(#c6c1e6,#6576aa);box-shadow:0 -11px 0 #ffffff6b}
.arena-scene.endless{background:linear-gradient(160deg,#1b1547,#443086 60%,#8c438b)}
.arena-scenery{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.8}
.arena-scenery .object{position:absolute;font-size:clamp(28px,5vw,47px);filter:drop-shadow(0 7px 2px #0b1b1e44);animation:sideSway 4s ease-in-out infinite alternate}
.arena-scenery .object:nth-child(1){left:3%;bottom:24%;animation-delay:-2s}.arena-scenery .object:nth-child(2){right:3%;bottom:24%}.arena-scenery .object:nth-child(3){right:21%;top:12%;font-size:34px;opacity:.85;animation-delay:-1s}
.actor{position:absolute;z-index:2;bottom:40px;width:39%;height:205px;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 15px 5px #05041a77)}
.actor:after{content:'';position:absolute;z-index:-1;bottom:-8px;width:75%;height:15px;border-radius:50%;background:#0a102255;filter:blur(5px)}
.player-actor{left:4%;animation:heroReady 2s ease-in-out infinite}
.enemy-actor{right:3%;animation:enemyReady 2.35s ease-in-out infinite;transform-origin:50% 80%}
.enemy-actor .beast{font-size:clamp(74px,12vw,115px);line-height:1;text-shadow:0 5px 18px #0006;display:block;transform:scaleX(-1)}
.enemy-actor.boss-actor .beast{font-size:clamp(95px,15vw,135px);filter:drop-shadow(0 0 18px #ffdd9a55)}
.actor .avatar-svg{height:190px;width:175px;max-width:100%;animation:none}
.player-actor.casting{animation:heroCast .82s cubic-bezier(.23,.82,.5,1) both}
.enemy-actor.struck{animation:monsterStruck .68s ease-in-out both}
.enemy-actor.lunging{animation:monsterLunge .64s ease-in-out both}
.player-actor.hurt{animation:heroHurt .65s ease-in-out both}
.arena-vs{position:absolute;top:23%;left:50%;transform:translateX(-50%);z-index:2;color:#ffe397;font-weight:1000;font-size:25px;text-shadow:0 2px 16px #161428}
.arena-name{position:absolute;bottom:10px;z-index:2;padding:5px 10px;border-radius:11px;background:#15172cbb;font-size:13px;font-weight:850;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arena-name.left{left:4%}.arena-name.right{right:4%}
.arena-pets{position:absolute;bottom:50px;left:27%;z-index:3;font-size:31px;display:flex;flex-direction:column;gap:0;pointer-events:none}.arena-pets span{animation:petFloat 1.7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 7px #10142b)}.arena-pets span:nth-child(2){animation-delay:-.7s}
.arena-pets.helping{animation:helperSurge .8s ease-out both}
.arena-projectile{position:absolute;left:29%;bottom:136px;z-index:4;width:39px;height:39px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#f8eb87 25%,#ff72d1 62%,#d34bff 72%,transparent 76%);box-shadow:0 0 21px 10px #f1b6ff,0 0 65px 20px #9bb9ff88;opacity:0;transform:scale(.3)}
.arena-projectile.flying{animation:spellTravel .72s ease-in forwards}
.arena-projectile.enemybolt{background:radial-gradient(circle,#fff 0 18%,#ffcf78 26%,#ff6868 60%,transparent 75%);box-shadow:0 0 20px 8px #ffb75d;left:72%;animation:enemyBolt .6s ease-in forwards}
.arena-damage{position:absolute;z-index:5;right:20%;top:25%;font-weight:1000;font-size:clamp(28px,5vw,48px);color:#fff5a2;text-shadow:0 2px #a64b82,0 5px 20px #000;opacity:0;pointer-events:none}
.arena-damage.show{animation:damageFloat .9s ease-out both}
.arena-damage.incoming{left:20%;right:auto;color:#ffb0bd}
.arena-scene.spell-flash{animation:arenaFlash .7s ease-out}
.battle-hp{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:5px 0 18px}.battle-hp .hp-card{padding:9px 12px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff25}
.battle-hp .healthtxt{font-size:12px;flex-wrap:wrap}.battle-hp .healthtxt span:last-child{font-variant-numeric:tabular-nums}
.safe-box{margin:18px 0;padding:17px;background:#56baaf16;border:1px solid #7de9dd77;border-radius:18px}.safe-box h3{margin:0 0 8px;color:#d0ffee}.safe-box p{margin:6px 0 12px;font-size:14px}.backup-status{color:#b4f2d4;font-size:13px}
.save-paste{width:100%;min-height:83px;border-radius:13px;border:1px solid #9c91d4;background:#161735;color:#fff;resize:vertical;font-size:12px;padding:10px;margin:10px 0}
.filepick{position:absolute;left:-99999px;width:1px;height:1px}
@keyframes driftMagic{to{transform:translateX(8%) translateY(-5%)}}
@keyframes sideSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes heroReady{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes enemyReady{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.025)}}
@keyframes heroCast{0%{transform:translate(0,0) scale(1)}28%{transform:translate(-15px,-13px) rotate(-8deg)}48%{transform:translate(38px,-18px) rotate(13deg) scale(1.09)}70%{transform:translate(17px,-9px) rotate(-2deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes monsterStruck{0%{transform:translate(0,0);filter:brightness(1)}28%{transform:translate(20px,-10px) rotate(13deg);filter:brightness(2.4)}55%{transform:translate(-8px,3px) rotate(-11deg);filter:brightness(1.6)}85%{transform:translate(7px,0) rotate(3deg)}100%{transform:translate(0,0);filter:brightness(1)}}
@keyframes monsterLunge{0%,100%{transform:translate(0,0)}30%{transform:translate(20px,-11px)}55%{transform:translate(-60px,-15px) scale(1.15)}80%{transform:translate(-6px,0)}}
@keyframes heroHurt{0%,100%{transform:translate(0,0)}30%{transform:translate(-17px,-9px) rotate(-9deg);filter:brightness(1.9)}55%{transform:translate(14px,0) rotate(7deg)}75%{transform:translate(-5px,0)}}
@keyframes spellTravel{0%{left:28%;bottom:130px;opacity:0;transform:scale(.35) rotate(0)}10%{opacity:1}70%{opacity:1;transform:scale(1.3) rotate(180deg)}100%{left:70%;bottom:136px;opacity:0;transform:scale(2.5) rotate(310deg)}}
@keyframes enemyBolt{0%{left:70%;bottom:138px;opacity:1;transform:scale(.6)}85%{opacity:1}100%{left:26%;bottom:125px;opacity:0;transform:scale(1.9)}}
@keyframes damageFloat{0%{opacity:0;transform:translateY(18px) scale(.5)}22%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-65px) scale(1)}}
@keyframes arenaFlash{0%,100%{filter:brightness(1)}55%{filter:brightness(1.34)}}
@keyframes helperSurge{0%{transform:translate(0,0) scale(1)}50%{transform:translate(48px,-35px) scale(1.35)}100%{transform:translate(0,0) scale(1)}}
@keyframes petFloat{from{transform:translateY(2px)}to{transform:translateY(-12px)}}
@media(max-width:480px){.arena-scene{height:250px}.actor{height:157px;bottom:34px}.actor .avatar-svg{height:157px;width:138px}.enemy-actor .beast{font-size:75px}.enemy-actor.boss-actor .beast{font-size:92px}.arena-pets{left:27%;bottom:43px;font-size:24px}.arena-name{font-size:11px}.battle-hp{gap:8px}.battle-hp .hp-card{padding:8px}}
@media(prefers-reduced-motion:reduce){.arena-projectile.flying,.arena-projectile.enemybolt,.arena-damage.show{animation:none!important;opacity:1}.arena-projectile{display:none}}

/* THE INFINITE ADVENTURES — original storybook exploration update */
:root{--paper:#fff2d6;--midnight:#121c39;--coral:#ffbd83}
body{background:radial-gradient(ellipse at 15% 0%,#546388 0%,transparent 52%),linear-gradient(150deg,#142c42,#242c4a 54%,#253e41);}
.shell{max-width:1200px}
.panel{border-color:#e8dbc43a;background:linear-gradient(155deg,#273953f5,#1f2c45f7);box-shadow:0 14px 45px #08162466}
.logo{background:linear-gradient(135deg,#ffb96e,#f06c85);font-size:31px}
.brand h1{font-size:clamp(22px,3vw,34px);letter-spacing:-.025em;color:#fff1d1}
.eyebrow{color:#9eeadf}
.btn{background:linear-gradient(120deg,#ffe2a4,#ffad81)}
.btn.purple{background:linear-gradient(120deg,#d4cdf8,#a8c7ee)}
.btn.teal{background:linear-gradient(120deg,#b2efcc,#8ee4dd)}
.btn:focus-visible{outline-color:#fff}
.explore-scene{position:relative;overflow:hidden;border-radius:22px;border:3px solid #fff0c985;background:#7fbab7;box-shadow:inset 0 0 30px #fff6,0 12px 25px #0a173c66;margin:15px 0 10px}
.explore-scene canvas{display:block;width:100%;height:auto;aspect-ratio:960/520;touch-action:manipulation;cursor:crosshair}
.explore-hud{position:absolute;left:12px;top:12px;z-index:2;max-width:75%;background:#182c42d9;border:1px solid #fff5;border-radius:13px;color:#fdf5e5;padding:9px 12px;font-size:12px;font-weight:800;text-shadow:0 1px 4px #0005;pointer-events:none}
.explore-help{color:#e6ecdc;font-size:13px;line-height:1.5}
.move-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:5px;justify-content:center;touch-action:none;margin:0 0 7px}
.move-pad button{border:2px solid #fff8;border-radius:14px;background:linear-gradient(145deg,#bdeddd,#7ab4bc);color:#193e4d;box-shadow:0 4px #36536c;font-size:23px;font-weight:950;touch-action:none;user-select:none}
.move-pad button:active{transform:translateY(3px);box-shadow:0 1px #36536c}
.move-pad .up{grid-column:2;grid-row:1}.move-pad .left{grid-column:1;grid-row:2}.move-pad .down{grid-column:2;grid-row:2}.move-pad .right{grid-column:3;grid-row:2}
.explore-ui{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.miniquest{background:#c9e8db17;border:1px solid #c9e8db55;border-radius:15px;padding:12px 14px;flex:1;min-width:200px}
.miniquest strong{color:#ffe8a7}
.puzzle-card{margin:20px 0 12px;background:linear-gradient(135deg,#30466a,#2a345e);border:2px solid #aec9e677;border-radius:19px;padding:20px;text-align:center}
.puzzle-heading{font-weight:850;color:#ffdeaa;font-size:15px;margin-bottom:13px}
.puzzle-pattern{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px auto 18px;min-height:70px}
.puzzle-tile{width:64px;height:69px;display:grid;place-items:center;background:#f8f5e8;border:3px solid #e9e5d5;border-radius:13px;box-shadow:0 5px 0 #19254170;color:#243347;font-size:28px;font-weight:900}
.puzzle-tile.questionmark{background:#f8dda7;color:#614f47}
.puzzle-grid{display:grid;grid-template-columns:repeat(2,70px);gap:8px;justify-content:center;margin:8px auto 19px}
.puzzle-grid .puzzle-tile{width:70px;height:70px}
.puzzle-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.puzzle-choice{min-height:94px;display:flex;gap:7px;flex-direction:column;justify-content:center;align-items:center;border:2px solid #d0d6e9;background:#fff9ea;color:#25334c;border-radius:15px;box-shadow:0 5px 0 #121f3780;padding:10px 4px;font-weight:900;font-size:22px;transition:transform .15s,background .15s;cursor:pointer;overflow:hidden}
.puzzle-choice:hover,.puzzle-choice:focus-visible{background:#ffe4b1;transform:translateY(-2px)}
.puzzle-choice .letter{color:#75849b;font-size:11px}
.puzzle-choice.weakened{opacity:.7;background:#eef0ef}
.puzzle-hint{color:#b2f6d8;font-size:14px;margin-top:12px;min-height:20px}
.symbol-pic{width:48px;height:48px}
.puzzle-type{font-size:11px;letter-spacing:.1em;color:#bed7ef;text-transform:uppercase;margin-bottom:5px}
.puzzle-note{font-size:12px;color:#b5d4cf;margin-top:12px}
.arena-scene{border-color:#ffe9b47a}
.arena-pets{left:27%;bottom:48px;display:flex;gap:1px;flex-direction:row;align-items:flex-end}
.arena-pets .sidekick{width:67px;max-width:13vw;height:120px;position:relative;display:flex;justify-content:center;align-items:end;transition:transform .15s}
.arena-pets .sidekick .avatar-svg{width:76px;height:115px;animation:petFloat 1.8s infinite alternate}
.arena-pets .sidekick .sigil{position:absolute;top:-10px;left:20%;font-size:21px;text-shadow:0 2px 5px #000}
.arena-pets .sidekick.attacking{animation:sidekickStrike .6s ease-in-out both}
@keyframes sidekickStrike{0%{transform:translate(0,0)}40%{transform:translate(85px,-36px) rotate(8deg)}60%{transform:translate(102px,-32px) scale(1.15)}100%{transform:translate(0,0)}}
.enemy-actor .beast-svg{width:min(100%,155px);height:180px;filter:drop-shadow(0 9px 5px #0005);animation:petFloat 2s infinite alternate}
@media(max-width:620px){.puzzle-choices{grid-template-columns:repeat(2,minmax(0,1fr))}.puzzle-tile{width:52px;height:55px}.puzzle-grid .puzzle-tile{width:60px;height:60px}.puzzle-card{padding:12px}.move-pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px)}.arena-pets{left:27%}.arena-pets .sidekick{width:42px;height:70px}.arena-pets .sidekick .avatar-svg{height:72px;width:47px}.arena-pets .sidekick .sigil{font-size:15px}.enemy-actor .beast-svg{height:125px}}
</style>

<body><div id="app" class="shell"></div><div id="toast" role="status" aria-live="polite"></div>
<script>

const SAVE_KEY='jacks-magic-battles-v1'; // Do not change: this finds Jack's original Chrome progress.
const ZONES=[
 {name:'Whispering Woods',short:'Forest',emoji:'🌳',desc:'Thick trees, enormous roots, and creatures hiding in the brush.',bg:'linear-gradient(145deg,#174b49,#263c72)',enemies:[['Moss Goblin','🍄'],['Moon Moth','🦋'],['Sprout Wizard','🌱'],['Twig Dragon','🐲']],boss:['Ancient Treant','🌲'],colors:['#b9e7a4','#7dbb7b','#345d56'],props:['🌲','🍄','🌿']},
 {name:'Ember Mountain',short:'Volcano',emoji:'🌋',desc:'A rugged trail over warm rocks and blackened ridges.',bg:'linear-gradient(145deg,#693046,#462b61)',enemies:[['Spark Imp','🔥'],['Lava Lizard','🦎'],['Ash Mage','🧙'],['Cinder Cub','🦁']],boss:['Volcano Titan','👹'],colors:['#ffd09b','#cd806e','#834351'],props:['🪨','🌋','🔥']},
 {name:'Cloudtop Kingdom',short:'Cliffs',emoji:'☁️',desc:'Follow windy cliff roads above the valleys.',bg:'linear-gradient(145deg,#38638e,#44377f)',enemies:[['Sky Sprite','🧚'],['Storm Owl','🦉'],['Cloud Knight','🪽'],['Star Wizard','🌟']],boss:['Thunder Emperor','⚡'],colors:['#c4dff1','#8bb3d2','#6c84ad'],props:['☁️','🌾','🪨']},

 {name:'The Open Road',short:'Beyond',emoji:'🧭',desc:'An endless trail of new places. Each five bosses opens a new chapter.',bg:'linear-gradient(145deg,#235e64,#36577f)',enemies:[['Trail Explorer','🦊'],['Wandering Golem','🗿'],['Wild Dragon','🐲'],['Mysterious Stranger','🦉']],boss:['Road Keeper','👑'],colors:['#b6ddce','#8cbdac','#498e95'],props:['🌾','🌲','🪨']}
];
function zoneInfo(index=S.zone){const z=ZONES[index]||ZONES[0];if(index!==ZONES.length-1)return z;
const themes=[['Verdant Basin','🌿',['#b3ddb8','#6fab91','#4a796b'],['🌳','🍃','🌻']],['Sunset Outpost','🏕️',['#efccaa','#c88e79','#97646d'],['🌵','⛺','🪨']],['Rainy Port','🌧️',['#b3d6e3','#81acbc','#5a779c'],['🌧️','⛵','⚓']],['Silver Valley','🗻',['#d8e3eb','#9eaec3','#5d819b'],['🌲','🏔️','❄️']]];
const chap=Math.max(1,1+Math.floor(Math.max(0,S.bossWins-50)/5)),t=themes[(chap-1)%themes.length];return {...z,name:`${t[0]} · Chapter ${chap}`,emoji:t[1],colors:t[2],props:t[3]};}
const STYLES=['Spiky','Short','Curly','Long'];const SKINS=['#f4d0b4','#d7a079','#a46c4d','#69402f'];const HAIRS=['#392339','#67402d','#e4b24c','#273866','#f5eff1'];const ROBES=['#7354d3','#259ab4','#db665e','#55a978','#dfad4e'];
const INITIAL=()=>({walkPos:{},lastPuzzleKind:'',reasoning:{tier:1,streak:0,misses:0,solved:0},retryOpponent:null,started:false,tutorialDone:false,screen:'creator',avatar:{name:'',skin:0,hair:0,style:0,robe:0},level:1,maxHp:250,hp:250,attackBonus:0,armor:0,completed:0,bossWins:0,zone:0,pets:[],equipped:[],loot:[],battle:null,question:null,tries:0,totalAnswered:0,endlessWins:0,notice:'',lastRecruit:null,soundOn:false});
let S=load();let previewName=S.avatar.name;let animating=false;
function load(){try{const a=JSON.parse(localStorage.getItem(SAVE_KEY));if(a&&typeof a==='object'&&a.avatar&&Number.isFinite(a.level))return {...INITIAL(),...a,walkPos:a.walkPos||{},avatar:{...INITIAL().avatar,...a.avatar}}}catch(e){}return INITIAL()}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
const el=()=>document.getElementById('app');const escapeHtml=(t)=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reasoning=()=>S.reasoning||(S.reasoning={tier:1,streak:0,misses:0,solved:0});
const skillLabels=['','Explorer','Detective','Puzzle Solver','Master Thinker'];
function recordPuzzle(mistakes){const a=reasoning();a.solved++;if(mistakes===0){a.streak++;a.misses=0;if(a.streak>=5&&a.tier<4){a.tier++;a.streak=0;toast('🧠 Your thinking challenges leveled up!');}}else{a.streak=0;if(mistakes>=2){a.misses++;if(a.misses>=2&&a.tier>1){a.tier--;a.misses=0;toast('🧠 Puzzles adjusted to help you practice!');}}else a.misses=0;}}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function toast(t){const o=document.getElementById('toast');o.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>o.textContent='',2600)}
function avatarSVG({skin=0,hair=0,style=0,robe=0}={},mini=false){const face=SKINS[skin]||SKINS[0],hc=HAIRS[hair]||HAIRS[0],rc=ROBES[robe]||ROBES[0];const hairShapes=[`<path d="M71 91 Q65 52 87 52 L101 42 L107 55 L125 39 L130 56 Q160 45 159 91 Q145 73 131 76 Q104 61 78 87Z" fill="${hc}"/>`,`<path d="M71 90 Q63 44 116 47 Q165 46 160 91 L149 81 Q109 65 78 86Z" fill="${hc}"/>`,`<g fill="${hc}"><circle cx="82" cy="68" r="17"/><circle cx="100" cy="54" r="18"/><circle cx="124" cy="53" r="20"/><circle cx="143" cy="63" r="17"/><circle cx="152" cy="83" r="13"/><circle cx="74" cy="86" r="12"/></g>`,`<path d="M71 79 Q69 44 112 47 Q156 41 162 79 L164 164 L149 157 L144 85 Q102 62 78 87 L77 162 L61 167Z" fill="${hc}"/>`];return `<svg aria-label="Your wizard" role="img" class="${mini?'avatar-svg avatar-mini':'avatar-svg'}" viewBox="0 0 230 265"><ellipse cx="115" cy="246" rx="66" ry="12" fill="#12122a" opacity=".35"/><path d="M76 167 Q111 147 154 164 L178 237 Q116 254 50 235Z" fill="${rc}" stroke="#181e49" stroke-width="5"/><path d="M107 162 L116 236 L125 162" fill="#eac6ff" opacity=".8"/><path d="M78 179 L44 209 Q35 217 45 225 Q57 228 64 217 L96 195Z" fill="${rc}"/><path d="M153 180 L185 211 Q194 216 188 227 Q177 234 166 218 L136 197Z" fill="${rc}"/><circle cx="51" cy="220" r="10" fill="${face}"/><circle cx="181" cy="221" r="10" fill="${face}"/><path d="M63 237 L64 249 L88 249 L95 235 M135 237 L143 249 L165 249 L169 234" fill="#41336a" stroke="#292247" stroke-width="5"/><circle cx="115" cy="108" r="47" fill="${face}" stroke="#272044" stroke-width="4"/><path d="M84 110 Q92 102 101 111 M129 111 Q138 102 146 111" stroke="#303146" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="94" cy="111" r="3" fill="#fff"/><circle cx="138" cy="111" r="3" fill="#fff"/><path d="M108 130 Q115 137 123 130" stroke="#985a6a" stroke-width="3" fill="none" stroke-linecap="round"/>${hairShapes[style]||hairShapes[0]}<path d="M186 215 L213 101" stroke="#7f5b3b" stroke-width="7" stroke-linecap="round"/><circle cx="216" cy="93" r="13" fill="#ffe480"/><path d="M216 66 L221 80 L235 86 L222 91 L217 106 L212 92 L199 86 L210 80Z" fill="#fff7c1"/><path d="M72 182 Q110 197 155 182" fill="none" stroke="#fff" opacity=".2" stroke-width="4"/></svg>`}
function header(){return `<header class="top"><div class="brand"><div class="logo">✨</div><div><div class="eyebrow">Explore • Discover • Think</div><h1>The Infinite Adventures <span class="versionlabel">🌍 Explore!</span></h1></div></div><div class="stats"><div class="chip">⚔️ Battles <b>${S.completed}</b></div><div class="chip">⭐ Level <b>${S.level}</b></div><div class="chip">👑 Bosses <b>${S.bossWins}</b></div></div></header>`}
function toolbar(){if(!S.started)return '';return `<div class="sectionnav"><button class="btn ghost smallbtn" data-do="home">🏠 Adventure</button><button class="btn ghost smallbtn" data-do="map">🗺️ World Map</button><button class="btn ghost smallbtn" data-do="pets">🐾 Pet Helpers (${S.equipped.length}/2)</button><button class="btn teal smallbtn" data-do="export">💾 Backup Save</button><button class="btn ghost smallbtn" data-do="settings">⚙️ Settings</button></div>`}
function sidebar(){const pets=S.equipped.map(i=>S.pets.find(p=>p.id===i)).filter(Boolean);return `<aside class="rightcol"><section class="panel"><div class="eyebrow">YOUR WIZARD</div><div class="row">${avatarSVG(S.avatar,true)}<div><h3>${escapeHtml(S.avatar.name||'Adventurer')}</h3><div class="tiny">Level ${S.level} • Spellcaster</div><div class="tiny">🗡️ Power ${power()}<br>🛡️ Armor ${S.armor}<br>🧠 Puzzles: ${skillLabels[reasoning().tier]}</div></div></div><div class="healthtxt"><span>❤️ Health</span><span class="number">${S.hp.toLocaleString()}/${S.maxHp.toLocaleString()}</span></div><div class="progresswrap"><div class="progressfill" style="width:${Math.max(0,100*S.hp/S.maxHp)}%"></div></div><div style="height:17px"></div><div class="eyebrow">EQUIPPED PET HELPERS</div><div class="helperpills">${pets.length?pets.map(p=>`<span class="helperpill">${p.emoji} ${escapeHtml(p.name)}</span>`).join(''):'<span class="tiny">Defeat monsters to collect pets!</span>'}</div></section><section class="panel"><div class="eyebrow">WORLD PROGRESS</div><h3>${zoneInfo().emoji} ${zoneInfo().name}</h3><p class="small">Every 3rd battle is a boss! Every 5 boss wins unlocks another world.</p><div class="healthtxt"><span>Next new world</span><span>${Math.min(5,S.bossWins%5)}/5 bosses</span></div><div class="progresswrap"><div class="progressfill" style="width:${S.zone===ZONES.length-1?100:(S.bossWins%5)*20}%;background:linear-gradient(90deg,#77efb1,#87dffa)"></div></div>${S.zone===3?'<p class="small">♾️ Endless mode unlocked!</p>':''}</section></aside>`}
function swatches(key,colors){return `<div class="swatches">${colors.map((c,i)=>`<button aria-label="${key} color ${i+1}" title="${key} color ${i+1}" class="swatch ${S.avatar[key]===i?'selected':''}" data-do="choose" data-key="${key}" data-value="${i}" style="background:${c}"></button>`).join('')}</div>`}
function creator(){return `<div class="panel wide"><span class="tag">🪄 STEP 1 · DESIGN YOUR HERO</span><div class="herohead"><h2>Create your magical character!</h2><p>Pick your look, name your wizard, and begin your adventure.</p></div><div class="creatorgrid"><div><div class="avatararea"><span class="star">✦</span><span class="star">✦</span><span class="star">✦</span>${avatarSVG(S.avatar)}</div><label class="formlabel" for="hero-name">YOUR WIZARD NAME</label><input id="hero-name" class="nameinput" required maxlength="16" value="${escapeHtml(S.avatar.name)}" placeholder="Name your wizard"/></div><div><label class="formlabel">CHOOSE SKIN COLOR</label>${swatches('skin',SKINS)}<label class="formlabel">HAIR STYLE</label><div class="row">${STYLES.map((v,i)=>`<button class="stylepick ${i===S.avatar.style?'selected':''}" data-do="choose" data-key="style" data-value="${i}">${v}</button>`).join('')}</div><label class="formlabel">HAIR COLOR</label>${swatches('hair',HAIRS)}<label class="formlabel">WIZARD ROBE COLOR</label>${swatches('robe',ROBES)}<div class="buttonrow"><button class="btn" data-do="start">✨ Start Adventure!</button></div></div></div><div class="safe-box" style="margin-top:22px"><h3>💾 Already have an adventure?</h3><p>Keep your levels, pet helpers and equipment! Restore your original save instead of starting again.</p><div class="row"><label for="import-file" class="btn teal smallbtn" style="cursor:pointer;display:inline-flex;align-items:center">⬆️ Restore Save File</label><input id="import-file" class="filepick" type="file" accept=".json,application/json"/></div><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:800">Or paste your old saved game text</summary><textarea class="save-paste" id="save-paste" placeholder="Paste save JSON from Dad's backup"></textarea><button class="btn teal smallbtn" data-do="paste-save">Restore My Adventure</button></details></div></div>`}
function tutorial(){return `<section class="panel"><span class="tag">🕯️ THE BEGINNING</span><h2>Welcome to the Magic Cave!</h2><p class="story">A tiny lantern flickers. A friendly wizard appears in front of you...</p><div class="avatararea" style="background:radial-gradient(circle,#6453a880,transparent 60%),linear-gradient(150deg,#2b293d,#151a34)"><span class="star">✧</span><span class="star">✦</span><span style="font-size:100px">🧙‍♂️</span></div><div class="banner"><strong>Grandmaster Glimmer:</strong> “Hello, ${escapeHtml(S.avatar.name)}! To cast a spell, solve a math problem. You can try as many times as you want, and each mistake makes the next challenge 1% easier. Let's practice!”</div><div class="buttonrow"><button class="btn" data-do="practice">🪄 Try a practice battle</button></div></section>`}
function power(){return Math.floor(125+S.level*73+S.attackBonus)}
function unlocked(){return Math.min(ZONES.length-1,Math.floor(S.bossWins/5))}
function tryFight(isPractice=false,pick=null){
 if(!isPractice&&!S.tutorialDone){S.screen='tutorial';render();return;}
 const boss=!isPractice&&(S.completed+1)%3===0,z=zoneInfo();
 const [name,emoji]=isPractice?['Training Slime','🫧']:boss?z.boss:(pick?.name? [pick.name,pick.emoji]:z.enemies[rand(0,z.enemies.length-1)]);
 const team=S.equipped.map(id=>S.pets.find(p=>p.id===id)).filter(Boolean),total=power()+team.reduce((n,p)=>n+Math.round(p.strength+S.level*14),0);
 const hp=isPractice?250:Math.min(4000000,Math.max(boss?1000:350,Math.round(total*(boss?6.9+S.zone*.24:3.0+S.zone*.13))));
 const attack=isPractice?14:Math.max(Math.ceil(S.maxHp*(boss?.28:.22))+S.armor,Math.floor(20+S.level*29+S.zone*30+(boss?S.level*6:0))); // percent of health means even strong heroes can lose
 S.battle={name,emoji,isBoss:boss,isPractice,hp,maxHp:hp,attack,turn:0,activePet:null,fallenPets:[],petHp:0,petMaxHp:0,feed:`${emoji} ${name} makes the first move. Think through the puzzle and lead your team!`};
 S.tries=0;S.question=makeQuestion();S.screen='battle';opponentAttack(true);save();render();setTimeout(playEnemyAnimation,160);
}
// NGAT-inspired original reasoning puzzles: adaptive steps within child-friendly elementary logic; no official test questions.
// These are original practice problems, NOT copied NGAT test questions or a score prediction.
function pic(shape,color){return {shape,color};}
function options(values,correct){const x=values.map((v,i)=>({v,correct:i===correct}));for(let i=x.length-1;i>0;i--){const j=rand(0,i);[x[i],x[j]]=[x[j],x[i]]}return {choices:x.map(a=>a.v),answer:x.findIndex(a=>a.correct)}}
function makeQuestion(){
 const types=['picture','sequence','grid','numbers','count','analogy'];
 let kind=types[rand(0,types.length-1)];if(kind===S.lastPuzzleKind)kind=types[(types.indexOf(kind)+1+rand(0,3))%types.length];S.lastPuzzleKind=kind;
 const shapes=['circle','square','triangle','diamond','star'];
 const colors=['#e46c63','#5d9acf','#65a77a','#e4a957'];
 const tier=reasoning().tier;
 if(kind==='picture'){
  const sets=[{same:['🐶','🐱','🐰','🐻'],other:'🚗',why:'Four pictures are animals, and one is a vehicle.'},{same:['🍎','🍌','🍇','🍐'],other:'🧦',why:'Four pictures are fruit, and one is clothing.'},{same:['🚲','🚗','🚌','🚕'],other:'🍪',why:'Four pictures are ways to travel, and one is food.'},{same:['👕','🧥','🧦','👟'],other:'🐟',why:'Four pictures are things you wear, and one is an animal.'},{same:['⚽','🏀','🏈','🎾'],other:'🥕',why:'Four pictures are sports balls, and one is food.'}];
  const set=sets[rand(0,sets.length-1)],o=options([...set.same.slice(0,3),set.other],3);
  return {kind,domain:'Picture thinking',prompt:'Which picture does NOT belong with the others?',...o,hint1:'Find four pictures that have something in common.',hint2:set.why};
 }
 if(kind==='sequence'){

function validateSave(obj){
 const value=obj?.game==='jacks-magic-battles'&&obj.save?obj.save:obj;
 if(!value||typeof value!=='object'||Array.isArray(value)||!value.avatar||typeof value.avatar.name!=='string'||!Number.isInteger(value.level)||value.level<1||value.level>100000||!Number.isInteger(value.completed)||value.completed<0||value.completed>1000000||!Array.isArray(value.pets)||value.pets.length>30000||!Array.isArray(value.equipped)||!Array.isArray(value.loot)||!Number.isInteger(value.bossWins)||value.bossWins<0||value.bossWins>1000000)throw Error('This file does not look like a Jack’s Magic Battles save.');
 const clean={...INITIAL(),...value,walkPos:value.walkPos||{},reasoning:{...INITIAL().reasoning,...value.reasoning},avatar:{...INITIAL().avatar,...value.avatar}};
 clean.avatar.name=String(clean.avatar.name).slice(0,16);
 clean.zone=Number.isInteger(clean.zone)?Math.max(0,Math.min(ZONES.length-1,clean.zone)):0;
 clean.screen=['creator','tutorial','battle','victory','reward','map','pets','settings','adventure','defeat'].includes(clean.screen)?clean.screen:'adventure';
 if(clean.screen==='battle'&&(!clean.battle||!clean.question))clean.screen='adventure';if(clean.battle){clean.battle.fallenPets=clean.battle.fallenPets||[];clean.battle.activePet=clean.battle.activePet||null;}
 clean.equipped=clean.equipped.filter(x=>clean.pets.some(p=>p.id===x)).slice(0,2);
 return clean;
}

function render(){stopExplore();let main;if(!S.started)main=creator();else if(S.screen==='tutorial')main=tutorial();else if(S.screen==='battle')main=battle();else if(S.screen==='victory')main=victory();else if(S.screen==='reward')main=reward();else if(S.screen==='defeat')main=defeat();else if(S.screen==='map')main=worldmap();else if(S.screen==='pets')main=pets();else if(S.screen==='settings')main=settings();else main=adventure();el().innerHTML=header()+(S.started?`<div style="margin-bottom:16px">${toolbar()}</div>`:'')+`<main class="layout">${main}${S.started?sidebar():''}</main><div class="footnote">The Infinite Adventures • Original cartoon world • Your adventure saves automatically • Backup in Settings</div>`;if(S.started&&S.screen==='adventure')requestAnimationFrame(startExplore);}
function goHome(){if(S.battle){S.screen='battle'}else if(!S.tutorialDone){S.screen='tutorial'}else if(S.screen==='reward'){return}else if(S.screen==='defeat'){S.hp=S.maxHp;S.screen='adventure'}else S.screen='adventure';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do,v=b.dataset.value;switch(a){case'choose':{const key=b.dataset.key;if(!['skin','hair','style','robe'].includes(key))return;S.avatar[key]=Number(v);const i=document.getElementById('hero-name');if(i)S.avatar.name=i.value.slice(0,16);save();render();break}case'start':{const i=document.getElementById('hero-name');if(!i?.value.trim()){toast('Choose a name for your hero first! ✨');i?.focus();return;}S.avatar.name=i.value.trim().slice(0,16);S.started=true;S.screen='tutorial';save();render();break}case'retry':{const opponent=S.retryOpponent;S.hp=S.maxHp;tryFight(Boolean(opponent?.isPractice),opponent);break}case'recover':S.hp=S.maxHp;S.screen=S.tutorialDone?'adventure':'tutorial';save();render();break;case'practice':tryFight(true);break;case'fight':tryFight(false);break;case'puzzle':answerPuzzle(Number(v));break;case'home':goHome();break;case'map':S.screen='map';save();render();break;case'pets':S.screen='pets';save();render();break;case'settings':S.screen='settings';save();render();break;case'continue':S.screen=unlocked()>S.zone?'map':'adventure';save();render();break;case'travel':{const i=Number(v);if(i>unlocked()){toast('Beat more bosses to unlock that place!');break}if(S.battle){toast('Finish your current battle first!');S.screen='battle';render();break}S.zone=i;S.screen='adventure';save();render();break}case'equip':{const id=v;if(!S.pets.some(p=>p.id===id))return;const at=S.equipped.indexOf(id);if(at>=0)S.equipped.splice(at,1);else if(S.equipped.length<2)S.equipped.push(id);else {toast('You can equip only 2 pets! Unequip one first.');return}save();render();break}case'reward':{if(S.screen!=='reward')return;const r=getRewards().find(x=>x.id===v);if(!r)return;if(r.id==='blade')S.attackBonus+=r.value;else if(r.id==='armor')S.armor+=r.value;else if(r.id==='heart'){S.maxHp+=r.value;S.hp=S.maxHp}S.loot.push({name:r.name,id:r.id,value:r.value});S.notice=`You earned ${r.name}! Your next magical adventure awaits.`;S.screen='victory';save();render();break}case'export':downloadSave();break;case'paste-save':{importSave(document.getElementById('save-paste')?.value.trim()||'');break}case'sound':S.soundOn=!S.soundOn;save();render();break;case'reset':{if(window.confirm('DANGER: Reset ALL levels, pets, and gear? Download a backup first.')){S=INITIAL();save();render()};break}}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('File is too large.');importSave(await file.text())}catch(err){toast('Could not read save file: '+err.message)}e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='math-form'){e.preventDefault();mathSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='hero-name'){S.avatar.name=e.target.value.slice(0,16);save();}});
render();
})();
</script></body></html>
