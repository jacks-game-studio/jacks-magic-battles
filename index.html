/* MAGIC BATTLES v2 — animated adventure; original save key and data model retained */
.versionlabel{display:inline-flex;margin-left:9px;align-items:center;font-size:11px;color:#ffe6a5;border:1px solid #ffdf8f66;padding:3px 7px;border-radius:40px;vertical-align:middle}
.arena-scene{height:300px;position:relative;isolation:isolate;overflow:hidden;margin:19px 0 12px;border-radius:22px;border:2px solid #9483ff77;background:linear-gradient(165deg,#263c67,#2d2c62);box-shadow:inset 0 0 50px #ffffff12,0 17px 27px #09071b66}
.arena-scene:before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 22% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 73% 16%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 46% 36%,#fff7 0 3px,transparent 4px),radial-gradient(circle at 84% 44%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 15% 46%,#ffd97155,transparent 23%);background-size:220px 200px;animation:driftMagic 12s linear infinite;pointer-events:none}
.arena-scene:after{content:'';position:absolute;bottom:-65px;left:-10%;width:120%;height:145px;border-radius:50% 50% 0 0;background:linear-gradient(#7c76ac66,#1c244e);box-shadow:0 -11px 0 #a0ccbf30;z-index:0}
.arena-scene.forest{background:linear-gradient(160deg,#124a53,#224674 55%,#576a7d)}.arena-scene.forest:after{background:linear-gradient(#66a277,#21565e);box-shadow:0 -11px 0 #a3e2a244}
.arena-scene.volcano{background:linear-gradient(160deg,#49245b,#963850 68%,#be5b51)}.arena-scene.volcano:after{background:linear-gradient(#8d4646,#482852);box-shadow:0 -11px 0 #ffb66388}
.arena-scene.sky{background:linear-gradient(155deg,#276eaf,#7289ce 67%,#baa3dd)}.arena-scene.sky:after{background:linear-gradient(#c6c1e6,#6576aa);box-shadow:0 -11px 0 #ffffff6b}
.arena-scene.endless{background:linear-gradient(160deg,#1b1547,#443086 60%,#8c438b)}
.arena-scenery{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.8}
.arena-scenery .object{position:absolute;font-size:clamp(28px,5vw,47px);filter:drop-shadow(0 7px 2px #0b1b1e44);animation:sideSway 4s ease-in-out infinite alternate}
.arena-scenery .object:nth-child(1){left:3%;bottom:24%;animation-delay:-2s}.arena-scenery .object:nth-child(2){right:3%;bottom:24%}.arena-scenery .object:nth-child(3){right:21%;top:12%;font-size:34px;opacity:.85;animation-delay:-1s}
.actor{position:absolute;z-index:2;bottom:40px;width:39%;height:205px;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 15px 5px #05041a77)}
.actor:after{content:'';position:absolute;z-index:-1;bottom:-8px;width:75%;height:15px;border-radius:50%;background:#0a102255;filter:blur(5px)}
.player-actor{left:4%;animation:heroReady 2s ease-in-out infinite}
.enemy-actor{right:3%;animation:enemyReady 2.35s ease-in-out infinite;transform-origin:50% 80%}
.enemy-actor .beast{font-size:clamp(74px,12vw,115px);line-height:1;text-shadow:0 5px 18px #0006;display:block;transform:scaleX(-1)}
.enemy-actor.boss-actor .beast{font-size:clamp(95px,15vw,135px);filter:drop-shadow(0 0 18px #ffdd9a55)}
.actor .avatar-svg{height:190px;width:175px;max-width:100%;animation:none}
.player-actor.casting{animation:heroCast .82s cubic-bezier(.23,.82,.5,1) both}
.enemy-actor.struck{animation:monsterStruck .68s ease-in-out both}
.enemy-actor.lunging{animation:monsterLunge .64s ease-in-out both}
.player-actor.hurt{animation:heroHurt .65s ease-in-out both}
.arena-vs{position:absolute;top:23%;left:50%;transform:translateX(-50%);z-index:2;color:#ffe397;font-weight:1000;font-size:25px;text-shadow:0 2px 16px #161428}
.arena-name{position:absolute;bottom:10px;z-index:2;padding:5px 10px;border-radius:11px;background:#15172cbb;font-size:13px;font-weight:850;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arena-name.left{left:4%}.arena-name.right{right:4%}
.arena-pets{position:absolute;bottom:50px;left:27%;z-index:3;font-size:31px;display:flex;flex-direction:column;gap:0;pointer-events:none}.arena-pets span{animation:petFloat 1.7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 7px #10142b)}.arena-pets span:nth-child(2){animation-delay:-.7s}
.arena-pets.helping{animation:helperSurge .8s ease-out both}
.arena-projectile{position:absolute;left:29%;bottom:136px;z-index:4;width:39px;height:39px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#f8eb87 25%,#ff72d1 62%,#d34bff 72%,transparent 76%);box-shadow:0 0 21px 10px #f1b6ff,0 0 65px 20px #9bb9ff88;opacity:0;transform:scale(.3)}
.arena-projectile.flying{animation:spellTravel .72s ease-in forwards}
.arena-projectile.enemybolt{background:radial-gradient(circle,#fff 0 18%,#ffcf78 26%,#ff6868 60%,transparent 75%);box-shadow:0 0 20px 8px #ffb75d;left:72%;animation:enemyBolt .6s ease-in forwards}
.arena-damage{position:absolute;z-index:5;right:20%;top:25%;font-weight:1000;font-size:clamp(28px,5vw,48px);color:#fff5a2;text-shadow:0 2px #a64b82,0 5px 20px #000;opacity:0;pointer-events:none}
.arena-damage.show{animation:damageFloat .9s ease-out both}
.arena-damage.incoming{left:20%;right:auto;color:#ffb0bd}
.arena-scene.spell-flash{animation:arenaFlash .7s ease-out}
.battle-hp{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:5px 0 18px}.battle-hp .hp-card{padding:9px 12px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff25}
.battle-hp .healthtxt{font-size:12px;flex-wrap:wrap}.battle-hp .healthtxt span:last-child{font-variant-numeric:tabular-nums}
.safe-box{margin:18px 0;padding:17px;background:#56baaf16;border:1px solid #7de9dd77;border-radius:18px}.safe-box h3{margin:0 0 8px;color:#d0ffee}.safe-box p{margin:6px 0 12px;font-size:14px}.backup-status{color:#b4f2d4;font-size:13px}
.save-paste{width:100%;min-height:83px;border-radius:13px;border:1px solid #9c91d4;background:#161735;color:#fff;resize:vertical;font-size:12px;padding:10px;margin:10px 0}
.filepick{position:absolute;left:-99999px;width:1px;height:1px}
@keyframes driftMagic{to{transform:translateX(8%) translateY(-5%)}}
@keyframes sideSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes heroReady{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes enemyReady{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.025)}}
@keyframes heroCast{0%{transform:translate(0,0) scale(1)}28%{transform:translate(-15px,-13px) rotate(-8deg)}48%{transform:translate(38px,-18px) rotate(13deg) scale(1.09)}70%{transform:translate(17px,-9px) rotate(-2deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes monsterStruck{0%{transform:translate(0,0);filter:brightness(1)}28%{transform:translate(20px,-10px) rotate(13deg);filter:brightness(2.4)}55%{transform:translate(-8px,3px) rotate(-11deg);filter:brightness(1.6)}85%{transform:translate(7px,0) rotate(3deg)}100%{transform:translate(0,0);filter:brightness(1)}}
@keyframes monsterLunge{0%,100%{transform:translate(0,0)}30%{transform:translate(20px,-11px)}55%{transform:translate(-60px,-15px) scale(1.15)}80%{transform:translate(-6px,0)}}
@keyframes heroHurt{0%,100%{transform:translate(0,0)}30%{transform:translate(-17px,-9px) rotate(-9deg);filter:brightness(1.9)}55%{transform:translate(14px,0) rotate(7deg)}75%{transform:translate(-5px,0)}}
@keyframes spellTravel{0%{left:28%;bottom:130px;opacity:0;transform:scale(.35) rotate(0)}10%{opacity:1}70%{opacity:1;transform:scale(1.3) rotate(180deg)}100%{left:70%;bottom:136px;opacity:0;transform:scale(2.5) rotate(310deg)}}
@keyframes enemyBolt{0%{left:70%;bottom:138px;opacity:1;transform:scale(.6)}85%{opacity:1}100%{left:26%;bottom:125px;opacity:0;transform:scale(1.9)}}
@keyframes damageFloat{0%{opacity:0;transform:translateY(18px) scale(.5)}22%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-65px) scale(1)}}
@keyframes arenaFlash{0%,100%{filter:brightness(1)}55%{filter:brightness(1.34)}}
@keyframes helperSurge{0%{transform:translate(0,0) scale(1)}50%{transform:translate(48px,-35px) scale(1.35)}100%{transform:translate(0,0) scale(1)}}
@keyframes petFloat{from{transform:translateY(2px)}to{transform:translateY(-12px)}}
@media(max-width:480px){.arena-scene{height:250px}.actor{height:157px;bottom:34px}.actor .avatar-svg{height:157px;width:138px}.enemy-actor .beast{font-size:75px}.enemy-actor.boss-actor .beast{font-size:92px}.arena-pets{left:27%;bottom:43px;font-size:24px}.arena-name{font-size:11px}.battle-hp{gap:8px}.battle-hp .hp-card{padding:8px}}
@media(prefers-reduced-motion:reduce){.arena-projectile.flying,.arena-projectile.enemybolt,.arena-damage.show{animation:none!important;opacity:1}.arena-projectile{display:none}}

/* THE INFINITE ADVENTURES — original storybook exploration update */
:root{--paper:#fff2d6;--midnight:#121c39;--coral:#ffbd83}
body{background:radial-gradient(ellipse at 15% 0%,#546388 0%,transparent 52%),linear-gradient(150deg,#142c42,#242c4a 54%,#253e41);}
.shell{max-width:1200px}
.panel{border-color:#e8dbc43a;background:linear-gradient(155deg,#273953f5,#1f2c45f7);box-shadow:0 14px 45px #08162466}
.logo{background:linear-gradient(135deg,#ffb96e,#f06c85);font-size:31px}
.brand h1{font-size:clamp(22px,3vw,34px);letter-spacing:-.025em;color:#fff1d1}
.eyebrow{color:#9eeadf}
.btn{background:linear-gradient(120deg,#ffe2a4,#ffad81)}
.btn.purple{background:linear-gradient(120deg,#d4cdf8,#a8c7ee)}
.btn.teal{background:linear-gradient(120deg,#b2efcc,#8ee4dd)}
.btn:focus-visible{outline-color:#fff}
.explore-scene{position:relative;overflow:hidden;border-radius:22px;border:3px solid #fff0c985;background:#7fbab7;box-shadow:inset 0 0 30px #fff6,0 12px 25px #0a173c66;margin:15px 0 10px}
.explore-scene canvas{display:block;width:100%;height:auto;aspect-ratio:960/520;touch-action:manipulation;cursor:crosshair}
.explore-hud{position:absolute;left:12px;top:12px;z-index:2;max-width:75%;background:#182c42d9;border:1px solid #fff5;border-radius:13px;color:#fdf5e5;padding:9px 12px;font-size:12px;font-weight:800;text-shadow:0 1px 4px #0005;pointer-events:none}
.explore-help{color:#e6ecdc;font-size:13px;line-height:1.5}
.move-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:5px;justify-content:center;touch-action:none;margin:0 0 7px}
.move-pad button{border:2px solid #fff8;border-radius:14px;background:linear-gradient(145deg,#bdeddd,#7ab4bc);color:#193e4d;box-shadow:0 4px #36536c;font-size:23px;font-weight:950;touch-action:none;user-select:none}
.move-pad button:active{transform:translateY(3px);box-shadow:0 1px #36536c}
.move-pad .up{grid-column:2;grid-row:1}.move-pad .left{grid-column:1;grid-row:2}.move-pad .down{grid-column:2;grid-row:2}.move-pad .right{grid-column:3;grid-row:2}
.explore-ui{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.miniquest{background:#c9e8db17;border:1px solid #c9e8db55;border-radius:15px;padding:12px 14px;flex:1;min-width:200px}
.miniquest strong{color:#ffe8a7}
.puzzle-card{margin:20px 0 12px;background:linear-gradient(135deg,#30466a,#2a345e);border:2px solid #aec9e677;border-radius:19px;padding:20px;text-align:center}
.puzzle-heading{font-weight:850;color:#ffdeaa;font-size:15px;margin-bottom:13px}

try{

function questKey(zone=S.zone,player=S){return String(zone===10?'10:'+Math.max(1,Number(player.openRoadChapter)||1):zone);}
function migrateRegionProgress(player){
 if(player.regionProgress&&typeof player.regionProgress==='object'&&!Array.isArray(player.regionProgress))return;
 const regions={};const oldZone=Math.max(0,Math.min(10,Number(player.zone)||0));
 const oldUnlocked=Math.max(oldZone,Math.min(10,Math.floor((Number(player.bossWins)||0)/5)));
 // Old saves never recorded which map creatures were defeated. Give full credit for
 // previously reached regions, and approximate checkpoints within the current one.
 for(let i=0;i<oldUnlocked;i++)regions[String(i)]=[...QUEST_ALL];
 const priorInRegion=Math.max(0,Math.min(4,(Number(player.bossWins)||0)-oldZone*5));
 const bosses=Math.min(2,Math.floor(priorInRegion*3/5));
 if(oldZone>=oldUnlocked)regions[String(oldZone)]=QUEST_ALL.slice(0,bosses*3);

 if(!Number.isInteger(Number(player.openRoadChapter))||Number(player.openRoadChapter)<1)player.openRoadChapter=1;
}
// This upgrade moves JACK one region ONCE when his existing browser save is loaded
// (or a prior save is imported). The marker is stored inside the save JSON, so
// installing another build or reloading cannot transport him a second time.
function isJackTransferEligible(player){
 return Boolean(player&&player.started&&player.tutorialDone&&
   /^jack(?:\b|$)/i.test(String(player.avatar?.name||'').trim())&&
   Number.isFinite(Number(player.bossWins))&&Number(player.bossWins)>=3&&
   !player[JACK_TRANSFER_KEY]&&player.screen!=='battle'&&player.screen!=='reward');
}
function transferJackToNextRegionOnce(player){
 if(!isJackTransferEligible(player))return false;
 migrateRegionProgress(player);
 const from=Math.max(0,Math.min(ZONES.length-1,Number(player.zone)||0));
 const chapter=Math.max(1,Number(player.openRoadChapter)||1);
 // Credit all completed checkpoints in previous regions and the Gatekeeper
 // that Jack has already defeated. Preserve all unrelated game data.
 for(let z=0;z<=from;z++){
  const key=z===10?'10:'+chapter:String(z);
  const existing=Array.isArray(player.regionProgress[key])?player.regionProgress[key]:[];
  player.regionProgress[key]=Array.from(new Set([...existing,...QUEST_ALL]));
 }
 if(from<ZONES.length-1){
  player.zone=from+1;
  player.walkPos={...(player.walkPos||{}),[player.zone]:{x:235,y:465}};
 }else{
  player.openRoadChapter=chapter+1;
 }
 player.screen='adventure';player.battle=null;player.question=null;
 player.retryOpponent=null;player.tries=0;
 player[JACK_TRANSFER_KEY]={from,to:player.zone,chapter:player.openRoadChapter};
 const destination=from<ZONES.length-1?ZONES[player.zone].name:'the next Open Road chapter';

}

 const st=Math.floor(index/3),current=questStage(zone);

function questSlots(zone=S.zone){

  const stage=Math.floor(index/3),boss=index%3===2,final=boss&&stage===2;

  const name=boss?`${n[0]} ${final?'Gatekeeper':stage===0?'Warden':'Champion'}`:n[0];

const SCORE_MIN=1,SCORE_MAX=1000;

 l.grade=Math.max(0,Math.min(6,Number(l.grade)||0));
 // IMPORTANT: When restoring pre-v3 saves, preserve previous academic placement.
 const prior=Number(l.challenge);
 if(!Number.isFinite(Number(l.rating))||Number(l.rating)<1||Number(l.rating)>1000){
  l.rating=ratingFromChallenge(Number.isFinite(prior)?prior:l.grade*4+2);
 }
 setLearningRating(l,l.rating);
 l.version=Math.max(4,Number(l.version)||0);
 if(!l.domainRatings||typeof l.domainRatings!=='object')l.domainRatings={};
 for(const d of Object.keys(DOMAINS)){

 }

 l.solved=Number(l.solved)||0;l.firstTry=Number(l.firstTry)||0;l.battles=Number(l.battles)||0;
 ensureArithmetic(l);

function victory(){const p=S.lastRecruit;const newZone=unlocked();return `<section class="panel"><span class="tag">🎊 ${S.tutorialDone&&S.completed===0?'TRAINING COMPLETE':'YOU WON!'}</span><div class="levelburst">✨🌟✨</div><h2>${S.completed===0?'The forest awaits!':'Level '+S.level+'! Incredible!'}</h2><p class="story">${escapeHtml(S.notice)}</p>${p?`<div class="banner">🐾 New magical helper recruited: <strong>${p.emoji} ${escapeHtml(p.name)}</strong>! ${S.equipped.includes(p.id)?'Automatically added to your team.':'Find it in Pet Helpers.'}</div>`:''}<div class="menuitems"><div class="menuitem"><span class="menuicon">💗</span><span>${S.completed===0?'Your health is full!':`Maximum health increased to ${S.maxHp.toLocaleString()}!`}</span></div><div class="menuitem"><span class="menuicon">✨</span><span>Next attack power: ${power().toLocaleString()}</span></div></div>${newZone>S.zone?`<div class="banner">🔓 NEW WORLD UNLOCKED: ${ZONES[newZone].emoji} ${ZONES[newZone].name}!</div>`:''}<div class="buttonrow"><button class="btn" data-do="continue">${newZone>S.zone?'🗺️ See New World':'⚔️ Continue Adventure'}</button><button class="btn purple" data-do="pets">🐾 Pet Helpers</button></div></section>`}
function getRewards(){const t=S.level;const tier=Math.floor(S.bossWins/3)+1;return[{id:'blade',emoji:'⚔️',name:`Starlight Sword +${tier}`,desc:`Add ${Math.floor(90+t*22)} power to every math spell!`,value:Math.floor(90+t*22)}, {id:'armor',emoji:'🛡️',name:`Moonstone Armor +${tier}`,desc:`Block ${Math.floor(12+t*6)} damage from each monster strike.`,value:Math.floor(12+t*6)}, {id:'heart',emoji:'💎',name:`Heart Crystal +${tier}`,desc:`Gain ${100+t*12} extra maximum health forever!`,value:100+t*12}]}
function reward(){return `<section class="panel"><span class="tag">👑 BOSS DEFEATED!</span><div class="levelburst">🏆</div><h2>Choose ONE amazing reward!</h2><p>Each boss drops stronger gear as you level up. Pick the reward you like best.</p><div class="banner">✨ Level ${S.level} reached! +100 maximum health. 🐾 You also recruited ${S.lastRecruit?.emoji||''} ${escapeHtml(S.lastRecruit?.name||'a helper')}!</div><div class="rewardgrid">${getRewards().map(r=>`<article class="reward"><div class="big">${r.emoji}</div><strong>${escapeHtml(r.name)}</strong><p>${escapeHtml(r.desc)}</p><button class="btn smallbtn" data-do="reward" data-value="${r.id}">Choose ${r.emoji}</button></article>`).join('')}</div>${unlocked()>S.zone?`<div class="banner">🔓 ${ZONES[unlocked()].emoji} A new world is unlocked, too!</div>`:''}</section>`}
function worldmap(){const gate=unlocked();return `<section class="panel"><span class="tag">🗺️ WORLD MAP</span><h2>Places to explore</h2><p>Defeat three bosses and six regular encounters to unlock the next region. The final road has endlessly changing chapters—you never have to stay in one boring arena.</p>
 <div class="mapgrid"><article class="mapitem"><div class="mapicon">🕯️</div><div><h3>Training Cave ✅</h3><p class="small">Your first lesson in thinking puzzles and friendly battles.</p></div></article>
 ${ZONES.map((raw,i)=>{const z=zoneInfo(i),locked=i>gate;return `<article class="mapitem ${i===S.zone?'active':''} ${locked?'locked':''}"><div class="mapicon">${locked?'🔒':z.emoji}</div><div style="flex:1"><h3>${escapeHtml(z.name)} ${i===S.zone?'📍':''}</h3><p class="small">${escapeHtml(z.desc)}</p>${locked?`<div class="tiny">Finish the previous region’s three bosses to unlock this place</div>`:`<button class="btn ${i===S.zone?'ghost':'teal'} smallbtn" data-do="travel" data-value="${i}">${i===S.zone?'Continue Exploring':'Travel Here 🧭'}</button>`}</div></article>`}).join('')}
 </div><div class="buttonrow"><button class="btn purple" data-do="home">← Back to Exploring</button></div></section>`;}
function pets(){return `<section class="panel"><span class="tag">🐾 YOUR MAGIC COLLECTION</span><h2>Pet Helpers</h2><p>You can equip <b>two</b> magic helpers. Each has a powerful special attack. Defeat new monsters to collect them all!</p><div class="banner">Equipped: <b>${S.equipped.length} of 2</b> • Collected: ${S.pets.length} creatures</div><div class="petlist">${S.pets.length?S.pets.map(p=>`<article class="petitem"><span class="peticon">${p.emoji}</span><div style="flex:1"><h3>${escapeHtml(p.name)}</h3><div class="tiny">Level ${p.level} • ${escapeHtml(p.special)} • Power ${Math.round(p.strength+S.level*14)}</div></div><button class="btn ${S.equipped.includes(p.id)?'ghost':'teal'} smallbtn" data-do="equip" data-value="${p.id}">${S.equipped.includes(p.id)?'✓ Equipped':'Equip'}</button></article>`).join(''):'<p>Once you win your first real battle, your new pet will appear here!</p>'}</div><div class="buttonrow"><button class="btn purple" data-do="home">← Back</button></div></section>`}
function realismLabel(){const n=Number(S.realism??30);return n<25?'🎨 Playful cartoons':n<65?'📖 Illustrated storybook':'✨ Detailed fantasy creatures';}
function realismPreviews(){const demo=[{name:'Twig Dragon',emoji:'🐲'},{name:'Storm Owl',emoji:'🦉'},{name:'Crystal Colossus',emoji:'💎',isBoss:true},{name:'Cinder Cub',emoji:'🦁'}];return demo.map(c=>`<div class="look-card">${monsterSVG(c)}<div>${escapeHtml(c.name)}</div></div>`).join('');}
function settings(){return `<section class="panel"><span class="tag">⚙️ PREFERENCES</span><h2>Game Settings & Save Safety</h2><p>Your adventure automatically saves on this website in this browser. Download a backup before changing files, browsers, or computers.</p>
 <div class="banner">⭐ Level ${S.level} • ⚔️ ${S.completed} battles • 🐾 ${S.pets.length} pets • 👑 ${S.bossWins} bosses</div>
 <section id="look-lab" class="look-lab" aria-label="Realisticness Bar"><h3>🎨 Realisticness Bar <span id="realism-number">${Math.round(S.realism??30)}%</span></h3><p class="small" style="margin:6px 0;color:#d7eef1">Slide it to change how the monsters look. From simple cartoons to shaded fantasy creatures — never too scary!</p><input id="realisticness-bar" class="real-range" aria-label="Realisticness" type="range" min="0" max="100" step="5" value="${Math.round(S.realism??30)}"><div class="look-labels"><span>0% 🎨 Cartoon</span><span>50% 📖 Storybook</span><span>100% 🪄 Detailed fantasy</span></div><div class="look-state" id="look-state">${realismLabel()}</div><div class="look-previews" id="look-previews">${realismPreviews()}</div><p class="look-note">Try the bar as much as you want. It only changes artwork. Levels, HP, puzzles, pets and equipment stay exactly the same.</p></section>
 <section class="learning-settings"><h3>📚 Learning Level: ${learning().rating} / 1000</h3><p class="small">Starting grade: <b>${S.learning?.gradeSet?GRADE_NAMES[learning().grade]:'Not yet selected'}</b>. This does not limit how far questions can advance. Your permanent Learning Level (1–1000) is separate from your wizard's combat level, and stays in your save file.</p><button class="btn teal smallbtn" data-do="learning">📈 View Learning Journey</button><details style="margin-top:12px"><summary style="cursor:pointer">Parent: change initial grade or restart learning placement</summary><p class="small">This resets only learning-skill history and challenge placement, not character levels, pets, gear, or boss wins.</p><select id="grade-change" class="nameinput grade-select" aria-label="New learning starting grade">${learningGradeOptions(learning().grade)}</select><button class="btn ghost smallbtn" data-do="grade-reset">Reset Learning Placement</button></details></section>
 <section class="music-controls"><h3>🎵 Adventure Soundtrack</h3><p class="small" style="margin-top:6px">🌿 Peaceful flute-and-harp melodies while exploring • ⚔️ energetic battle music • 👑 epic boss music. Smooth transitions, no short synthetic loop. Music streams from the internet and starts after you tap or press a key.</p><details style="margin:9px 0 13px"><summary style="cursor:pointer;font-size:12px;color:#d7e6ee">Music credits and licenses (CC0)</summary><p class="tiny">Exploring: <a style="color:#b5fae1" href="https://opengameart.org/content/town-theme-rpg" target="_blank" rel="noopener">Town Theme RPG</a> by cynicmusic; <a style="color:#b5fae1" href="https://opengameart.org/content/magic-town" target="_blank" rel="noopener">Magic Town</a> by controllerhead.<br>Battles: <a style="color:#b5fae1" href="https://opengameart.org/content/jrpg-epic-rock-battle-theme-1" target="_blank" rel="noopener">JRPG Epic Rock Battle Theme</a> by HydroGene.<br>Bosses: <a style="color:#b5fae1" href="https://opengameart.org/content/boss-battle-theme" target="_blank" rel="noopener">Battle RPG Theme</a> by Cleyton Kauffman. All listed under CC0 on OpenGameArt.</p></details><button class="btn teal smallbtn" data-do="music">${S.musicOn?'🎶 Turn Music Off':'▶ Play Music'}</button><label class="formlabel" for="music-volume">Music volume: <span id="music-volume-number">${S.musicVolume??70}%</span></label><input type="range" id="music-volume" min="0" max="100" step="5" value="${S.musicVolume??70}" aria-label="Music volume" /></section>
 <section class="safe-box"><h3>💾 Back Up Your Adventure</h3><p>This downloads a small save file containing your level, pets, equipment, and character. Keep it safe with your dad.</p><div class="row"><button class="btn teal" data-do="export">⬇️ Download My Save</button><label for="import-file" class="btn purple" style="cursor:pointer;display:inline-flex;align-items:center">⬆️ Restore a Save</label><input id="import-file" class="filepick" type="file" accept=".json,application/json"/></div>
 <p class="backup-status">✅ Works with your original Magic Battles save. Importing never deletes the backup file.</p>
 <details><summary style="cursor:pointer;font-weight:850;padding:8px 0">Have save text from the original Chrome tab?</summary><p>Paste the saved JSON below. Ask Dad for help if needed.</p><textarea class="save-paste" id="save-paste" placeholder="Paste the original save JSON here"></textarea><button class="btn teal smallbtn" data-do="paste-save">✨ Restore Pasted Save</button></details>
 </section><div class="row"><button class="btn ghost smallbtn" data-do="sound">${S.soundOn?'🔊 Sound: On':'🔇 Sound: Off'}</button></div>
 <div class="buttonrow"><button class="btn purple" data-do="home">← Keep Playing</button><button class="btn ghost" data-do="reset">🗑️ Reset My Adventure</button></div><p class="tiny danger">Reset erases this browser's progress. Download a backup before using it.</p></section>`}
function downloadSave(){
 try{save();const text=JSON.stringify({game:'jacks-magic-battles',format:2,learningVersion:4,learningRating:S.learning?.rating??null,exportedAt:new Date().toISOString(),save:S},null,2);
 const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`infinite-adventures-hero-${S.level}-learning-${S.learning?.rating||'new'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Your adventure backup is downloading! 💾');}
 catch(e){toast('Could not download. Try Chrome on your computer.')}
}
function validateSave(obj){
 const value=obj?.game==='jacks-magic-battles'&&obj.save?obj.save:obj;
 if(!value||typeof value!=='object'||Array.isArray(value)||!value.avatar||typeof value.avatar.name!=='string'||!Number.isInteger(value.level)||value.level<1||value.level>100000||!Number.isInteger(value.completed)||value.completed<0||value.completed>1000000||!Array.isArray(value.pets)||value.pets.length>30000||!Array.isArray(value.equipped)||!Array.isArray(value.loot)||!Number.isInteger(value.bossWins)||value.bossWins<0||value.bossWins>1000000)throw Error('This file does not look like a Jack’s Magic Battles save.');
 const clean={...INITIAL(),...value,walkPos:value.walkPos||{},reasoning:{...INITIAL().reasoning,...value.reasoning},avatar:{...INITIAL().avatar,...value.avatar}};
 clean.avatar.name=String(clean.avatar.name).slice(0,16);
 clean.zone=Number.isInteger(clean.zone)?Math.max(0,Math.min(ZONES.length-1,clean.zone)):0;clean.realism=Number.isFinite(Number(clean.realism))?Math.max(0,Math.min(100,Number(clean.realism))):30;
 clean.screen=['creator','tutorial','battle','victory','reward','map','pets','settings','adventure','defeat','learning'].includes(clean.screen)?clean.screen:'adventure';
 if(clean.screen==='battle'&&(!clean.battle||!clean.question))clean.screen='adventure';if(clean.battle){clean.battle.fallenPets=clean.battle.fallenPets||[];clean.battle.activePet=clean.battle.activePet||null;}
 clean.learning=(value.learning&&typeof value.learning==='object')?value.learning:null;
 if(clean.learning){
  const l=clean.learning, old=Number(l.challenge);
  if(!Number.isInteger(Number(l.rating))||Number(l.rating)<1||Number(l.rating)>1000)l.rating=ratingFromChallenge(Number.isFinite(old)?old:(Number(l.grade)||0)*4+2);
  l.rating=clamp(Math.round(Number(l.rating)),1,1000);
  l.challenge=challengeFromRating(l.rating);
  if(!l.domainRatings||typeof l.domainRatings!=='object')l.domainRatings={number:l.rating,visual:l.rating,verbal:l.rating};
  for(const d of Object.keys(DOMAINS)){const v=Number(l.domainRatings[d]);l.domainRatings[d]=Number.isFinite(v)&&v>=1&&v<=1000?Math.round(v):l.rating;}
  l.version=4;
 }
 migrateRegionProgress(clean);
 clean.equipped=clean.equipped.filter(x=>clean.pets.some(p=>p.id===x)).slice(0,2);
 return clean;
}
function importSave(text){
 try{if(text.length>5_000_000)throw Error('Save too large.');const candidate=validateSave(JSON.parse(text));
 if(S.started&&!window.confirm(`Restore ${candidate.avatar.name}'s Level ${candidate.level} adventure? This will replace this browser's current Level ${S.level} save. Download a backup first if you want to keep both.`))return;
 S=candidate;
 if(isJackTransferEligible(S))transferJackToNextRegionOnce(S);
 save();render();beginMusicFromGesture();toast(`Save restored! Welcome back, ${S.avatar.name}! ⭐`);
 }catch(e){toast('Could not restore: '+e.message);}
}
function renderUnsafe(){stopExplore();syncMusic();document.body.classList.toggle('battle-mode',S.started&&S.screen==='battle');let main;if(!S.started)main=creator();else if(!learning().gradeSet)main=gradeSetup();else if(S.screen==='tutorial')main=tutorial();else if(S.screen==='battle')main=battle();else if(S.screen==='victory')main=victory();else if(S.screen==='reward')main=reward();else if(S.screen==='defeat')main=defeat();else if(S.screen==='map')main=worldmap();else if(S.screen==='pets')main=pets();else if(S.screen==='learning')main=learningDashboard();else if(S.screen==='settings')main=settings();else main=adventure();el().innerHTML=header()+(S.started?`<div class="toolbar-wrap" style="margin-bottom:16px">${toolbar()}</div>`:'')+`<main class="layout ${S.screen==='battle'?'layout-battle':''}">${main}${S.started&&S.screen!=='battle'?sidebar():''}</main><div class="footnote">The Infinite Adventures • Original cartoon world • Your adventure saves automatically • Backup in Settings</div>`;if(S.started&&S.screen==='adventure')requestAnimationFrame(startExplore);}
function render(){
 try{return renderUnsafe()}
 catch(problem){
  console.error('Battle recovery: cannot show saved screen',problem);
  try{const saved=localStorage.getItem(SAVE_KEY);if(saved)localStorage.setItem(SAVE_KEY+'-recovery-20261004',saved);}catch(ignore){}
  if(S.started){
   S.battle=null;S.question=null;S.tries=0;
   S.screen=S.tutorialDone?'adventure':'tutorial';
   S.notice='A previous fight could not be reopened, so you safely returned to camp. Your level and pets were kept.';
   try{save();return renderUnsafe()}catch(second){console.error('Recovery could not draw',second);}
  }
  throw problem;
 }
}
function goHome(){if(S.battle){S.screen='battle'}else if(!S.tutorialDone){S.screen='tutorial'}else if(S.screen==='reward'){return}else if(S.screen==='defeat'){S.hp=S.maxHp;S.screen='adventure'}else S.screen='adventure';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do,v=b.dataset.value;switch(a){case'learning':S.screen='learning';save();render();break;case'grade-confirm':{
  const v=document.getElementById('learning-grade-setup')?.value;
  if(v===undefined||v===''){toast('Please choose your school grade first! 📚');return;}
  S.learning=freshLearning(v);
  if(S.screen==='battle'&&S.battle){S.question=makeQuestion();S.tries=0;}
  save();render();toast('Your learning adventure begins! ✨');break;
 }case'grade-reset':{
  const v=document.getElementById('grade-change')?.value;
  if(!window.confirm('Restart ONLY academic skill progress at '+GRADE_NAMES[Number(v)]+'? Wizard levels, pets and boss wins remain saved.'))return;
  S.learning=freshLearning(v);
  if(S.screen==='battle'){S.question=makeQuestion();S.tries=0;}
  save();render();toast('Your new learning starting point is ready!');break;
 }case'choose':{const key=b.dataset.key;if(!['skin','hair','style','robe'].includes(key))return;S.avatar[key]=Number(v);const i=document.getElementById('hero-name');if(i)S.avatar.name=i.value.slice(0,16);save();render();break}case'start':{const i=document.getElementById('hero-name');if(!i?.value.trim()){toast('Choose a name for your hero first! ✨');i?.focus();return;}const grade=document.getElementById('creator-grade')?.value;if(grade===undefined||grade===''){toast('Choose your grade so your thinking journey starts at the right place! 📚');return;}S.learning=freshLearning(grade);S.pendingGrade=null;S.avatar.name=i.value.trim().slice(0,16);S.started=true;S.screen='tutorial';save();render();beginMusicFromGesture();break}case'retry':{const opponent=S.retryOpponent;S.hp=S.maxHp;tryFight(Boolean(opponent?.isPractice),opponent);break}case'recover':S.hp=S.maxHp;S.screen=S.tutorialDone?'adventure':'tutorial';save();render();break;case'practice':tryFight(true);break;case'fight':tryFight(false,nextQuest());break;case'next-zone':if(S.zone<unlocked()){S.zone++;save();render();}else toast('Defeat the final boss first!');break;case'new-chapter':S.screen='adventure';save();render();break;case'puzzle':answerPuzzle(Number(v));break;case'home':goHome();break;case'map':S.screen='map';save();render();break;case'pets':S.screen='pets';save();render();break;case'settings':S.screen='settings';save();render();break;case'look':S.screen='settings';save();render();document.getElementById('look-lab')?.scrollIntoView({behavior:'smooth',block:'center'});break;case'continue':S.screen=unlocked()>S.zone?'map':'adventure';save();render();break;case'travel':{const i=Number(v);if(i>unlocked()){toast('Beat more bosses to unlock that place!');break}if(S.battle){toast('Finish your current battle first!');S.screen='battle';render();break}S.zone=i;S.screen='adventure';save();render();break}case'equip':{const id=v;if(!S.pets.some(p=>p.id===id))return;const at=S.equipped.indexOf(id);if(at>=0)S.equipped.splice(at,1);else if(S.equipped.length<2)S.equipped.push(id);else {toast('You can equip only 2 pets! Unequip one first.');return}save();render();break}case'reward':{if(S.screen!=='reward')return;const r=getRewards().find(x=>x.id===v);if(!r)return;if(r.id==='blade')S.attackBonus+=r.value;else if(r.id==='armor')S.armor+=r.value;else if(r.id==='heart'){S.maxHp+=r.value;S.hp=S.maxHp}S.loot.push({name:r.name,id:r.id,value:r.value});S.notice=`You earned ${r.name}! Your next magical adventure awaits.`;S.screen='victory';if(isJackTransferEligible(S))transferJackToNextRegionOnce(S);save();render();break}case'export':downloadSave();break;case'paste-save':{importSave(document.getElementById('save-paste')?.value.trim()||'');break}case'sound':S.soundOn=!S.soundOn;save();render();break;case'music':S.musicOn=!S.musicOn;save();syncMusic();if(S.musicOn)beginMusicFromGesture();render();break;case'reset':{if(window.confirm('DANGER: Reset ALL levels, pets, and gear? Download a backup first.')){S=INITIAL();save();render()};break}}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('File is too large.');importSave(await file.text())}catch(err){toast('Could not read save file: '+err.message)}e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='math-form'){e.preventDefault();mathSubmit()}});
document.addEventListener('input',e=>{
 if(e.target.id==='hero-name'){S.avatar.name=e.target.value.slice(0,16);save();}
 if(e.target.id==='creator-grade'){S.pendingGrade=Number(e.target.value);save();}
 if(e.target.id==='music-volume'){S.musicVolume=Math.max(0,Math.min(100,Number(e.target.value)||0));document.getElementById('music-volume-number').textContent=S.musicVolume+'%';save();syncMusic();}
 if(e.target.id==='realisticness-bar'){
  S.realism=Math.max(0,Math.min(100,Number(e.target.value)||0));save();
  document.getElementById('realism-number').textContent=Math.round(S.realism)+'%';
  document.getElementById('look-state').textContent=realismLabel();
  document.getElementById('look-previews').innerHTML=realismPreviews();
 }
});
try{render()}catch(bootError){console.error('Game startup problem',bootError);window.dispatchEvent(new ErrorEvent('error',{message:String(bootError),error:bootError}));}
})();
</script></body></html>
