/* MAGIC BATTLES v2 — animated adventure; original save key and data model retained */
.versionlabel{display:inline-flex;margin-left:9px;align-items:center;font-size:11px;color:#ffe6a5;border:1px solid #ffdf8f66;padding:3px 7px;border-radius:40px;vertical-align:middle}
.arena-scene{height:300px;position:relative;isolation:isolate;overflow:hidden;margin:19px 0 12px;border-radius:22px;border:2px solid #9483ff77;background:linear-gradient(165deg,#263c67,#2d2c62);box-shadow:inset 0 0 50px #ffffff12,0 17px 27px #09071b66}
.arena-scene:before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 22% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 73% 16%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 46% 36%,#fff7 0 3px,transparent 4px),radial-gradient(circle at 84% 44%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 15% 46%,#ffd97155,transparent 23%);background-size:220px 200px;animation:driftMagic 12s linear infinite;pointer-events:none}
.arena-scene:after{content:'';position:absolute;bottom:-65px;left:-10%;width:120%;height:145px;border-radius:50% 50% 0 0;background:linear-gradient(#7c76ac66,#1c244e);box-shadow:0 -11px 0 #a0ccbf30;z-index:0}
.arena-scene.forest{background:linear-gradient(160deg,#124a53,#224674 55%,#576a7d)}.arena-scene.forest:after{background:linear-gradient(#66a277,#21565e);box-shadow:0 -11px 0 #a3e2a244}
.arena-scene.volcano{background:linear-gradient(160deg,#49245b,#963850 68%,#be5b51)}.arena-scene.volcano:after{background:linear-gradient(#8d4646,#482852);box-shadow:0 -11px 0 #ffb66388}
.arena-scene.sky{background:linear-gradient(155deg,#276eaf,#7289ce 67%,#baa3dd)}.arena-scene.sky:after{background:linear-gradient(#c6c1e6,#6576aa);box-shadow:0 -11px 0 #ffffff6b}
.arena-scene.endless{background:linear-gradient(160deg,#1b1547,#443086 60%,#8c438b)}
.arena-scenery{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.8}
.arena-scenery .object{position:absolute;font-size:clamp(28px,5vw,47px);filter:drop-shadow(0 7px 2px #0b1b1e44);animation:sideSway 4s ease-in-out infinite alternate}
.arena-scenery .object:nth-child(1){left:3%;bottom:24%;animation-delay:-2s}.arena-scenery .object:nth-child(2){right:3%;bottom:24%}.arena-scenery .object:nth-child(3){right:21%;top:12%;font-size:34px;opacity:.85;animation-delay:-1s}
.actor{position:absolute;z-index:2;bottom:40px;width:39%;height:205px;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 15px 5px #05041a77)}
.actor:after{content:'';position:absolute;z-index:-1;bottom:-8px;width:75%;height:15px;border-radius:50%;background:#0a102255;filter:blur(5px)}
.player-actor{left:4%;animation:heroReady 2s ease-in-out infinite}
.enemy-actor{right:3%;animation:enemyReady 2.35s ease-in-out infinite;transform-origin:50% 80%}
.enemy-actor .beast{font-size:clamp(74px,12vw,115px);line-height:1;text-shadow:0 5px 18px #0006;display:block;transform:scaleX(-1)}
.enemy-actor.boss-actor .beast{font-size:clamp(95px,15vw,135px);filter:drop-shadow(0 0 18px #ffdd9a55)}
.actor .avatar-svg{height:190px;width:175px;max-width:100%;animation:none}
.player-actor.casting{animation:heroCast .82s cubic-bezier(.23,.82,.5,1) both}
.enemy-actor.struck{animation:monsterStruck .68s ease-in-out both}
.enemy-actor.lunging{animation:monsterLunge .64s ease-in-out both}
.player-actor.hurt{animation:heroHurt .65s ease-in-out both}
.arena-vs{position:absolute;top:23%;left:50%;transform:translateX(-50%);z-index:2;color:#ffe397;font-weight:1000;font-size:25px;text-shadow:0 2px 16px #161428}
.arena-name{position:absolute;bottom:10px;z-index:2;padding:5px 10px;border-radius:11px;background:#15172cbb;font-size:13px;font-weight:850;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arena-name.left{left:4%}.arena-name.right{right:4%}
.arena-pets{position:absolute;bottom:50px;left:27%;z-index:3;font-size:31px;display:flex;flex-direction:column;gap:0;pointer-events:none}.arena-pets span{animation:petFloat 1.7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 7px #10142b)}.arena-pets span:nth-child(2){animation-delay:-.7s}
.arena-pets.helping{animation:helperSurge .8s ease-out both}
.arena-projectile{position:absolute;left:29%;bottom:136px;z-index:4;width:39px;height:39px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#f8eb87 25%,#ff72d1 62%,#d34bff 72%,transparent 76%);box-shadow:0 0 21px 10px #f1b6ff,0 0 65px 20px #9bb9ff88;opacity:0;transform:scale(.3)}
.arena-projectile.flying{animation:spellTravel .72s ease-in forwards}
.arena-projectile.enemybolt{background:radial-gradient(circle,#fff 0 18%,#ffcf78 26%,#ff6868 60%,transparent 75%);box-shadow:0 0 20px 8px #ffb75d;left:72%;animation:enemyBolt .6s ease-in forwards}
.arena-damage{position:absolute;z-index:5;right:20%;top:25%;font-weight:1000;font-size:clamp(28px,5vw,48px);color:#fff5a2;text-shadow:0 2px #a64b82,0 5px 20px #000;opacity:0;pointer-events:none}
.arena-damage.show{animation:damageFloat .9s ease-out both}
.arena-damage.incoming{left:20%;right:auto;color:#ffb0bd}
.arena-scene.spell-flash{animation:arenaFlash .7s ease-out}
.battle-hp{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:5px 0 18px}.battle-hp .hp-card{padding:9px 12px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff25}
.battle-hp .healthtxt{font-size:12px;flex-wrap:wrap}.battle-hp .healthtxt span:last-child{font-variant-numeric:tabular-nums}
.safe-box{margin:18px 0;padding:17px;background:#56baaf16;border:1px solid #7de9dd77;border-radius:18px}.safe-box h3{margin:0 0 8px;color:#d0ffee}.safe-box p{margin:6px 0 12px;font-size:14px}.backup-status{color:#b4f2d4;font-size:13px}
.save-paste{width:100%;min-height:83px;border-radius:13px;border:1px solid #9c91d4;background:#161735;color:#fff;resize:vertical;font-size:12px;padding:10px;margin:10px 0}
.filepick{position:absolute;left:-99999px;width:1px;height:1px}
@keyframes driftMagic{to{transform:translateX(8%) translateY(-5%)}}
@keyframes sideSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes heroReady{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes enemyReady{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.025)}}
@keyframes heroCast{0%{transform:translate(0,0) scale(1)}28%{transform:translate(-15px,-13px) rotate(-8deg)}48%{transform:translate(38px,-18px) rotate(13deg) scale(1.09)}70%{transform:translate(17px,-9px) rotate(-2deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes monsterStruck{0%{transform:translate(0,0);filter:brightness(1)}28%{transform:translate(20px,-10px) rotate(13deg);filter:brightness(2.4)}55%{transform:translate(-8px,3px) rotate(-11deg);filter:brightness(1.6)}85%{transform:translate(7px,0) rotate(3deg)}100%{transform:translate(0,0);filter:brightness(1)}}
@keyframes monsterLunge{0%,100%{transform:translate(0,0)}30%{transform:translate(20px,-11px)}55%{transform:translate(-60px,-15px) scale(1.15)}80%{transform:translate(-6px,0)}}
@keyframes heroHurt{0%,100%{transform:translate(0,0)}30%{transform:translate(-17px,-9px) rotate(-9deg);filter:brightness(1.9)}55%{transform:translate(14px,0) rotate(7deg)}75%{transform:translate(-5px,0)}}
@keyframes spellTravel{0%{left:28%;bottom:130px;opacity:0;transform:scale(.35) rotate(0)}10%{opacity:1}70%{opacity:1;transform:scale(1.3) rotate(180deg)}100%{left:70%;bottom:136px;opacity:0;transform:scale(2.5) rotate(310deg)}}
@keyframes enemyBolt{0%{left:70%;bottom:138px;opacity:1;transform:scale(.6)}85%{opacity:1}100%{left:26%;bottom:125px;opacity:0;transform:scale(1.9)}}
@keyframes damageFloat{0%{opacity:0;transform:translateY(18px) scale(.5)}22%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-65px) scale(1)}}
@keyframes arenaFlash{0%,100%{filter:brightness(1)}55%{filter:brightness(1.34)}}
@keyframes helperSurge{0%{transform:translate(0,0) scale(1)}50%{transform:translate(48px,-35px) scale(1.35)}100%{transform:translate(0,0) scale(1)}}
@keyframes petFloat{from{transform:translateY(2px)}to{transform:translateY(-12px)}}
@media(max-width:480px){.arena-scene{height:250px}.actor{height:157px;bottom:34px}.actor .avatar-svg{height:157px;width:138px}.enemy-actor .beast{font-size:75px}.enemy-actor.boss-actor .beast{font-size:92px}.arena-pets{left:27%;bottom:43px;font-size:24px}.arena-name{font-size:11px}.battle-hp{gap:8px}.battle-hp .hp-card{padding:8px}}
@media(prefers-reduced-motion:reduce){.arena-projectile.flying,.arena-projectile.enemybolt,.arena-damage.show{animation:none!important;opacity:1}.arena-projectile{display:none}}

</style>

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function toast(t){const o=document.getElementById('toast');o.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>o.textContent='',2600)}
function avatarSVG({skin=0,hair=0,style=0,robe=0}={},mini=false){const face=SKINS[skin]||SKINS[0],hc=HAIRS[hair]||HAIRS[0],rc=ROBES[robe]||ROBES[0];const hairShapes=[`<path d="M71 91 Q65 52 87 52 L101 42 L107 55 L125 39 L130 56 Q160 45 159 91 Q145 73 131 76 Q104 61 78 87Z" fill="${hc}"/>`,`<path d="M71 90 Q63 44 116 47 Q165 46 160 91 L149 81 Q109 65 78 86Z" fill="${hc}"/>`,`<g fill="${hc}"><circle cx="82" cy="68" r="17"/><circle cx="100" cy="54" r="18"/><circle cx="124" cy="53" r="20"/><circle cx="143" cy="63" r="17"/><circle cx="152" cy="83" r="13"/><circle cx="74" cy="86" r="12"/></g>`,`<path d="M71 79 Q69 44 112 47 Q156 41 162 79 L164 164 L149 157 L144 85 Q102 62 78 87 L77 162 L61 167Z" fill="${hc}"/>`];return `<svg aria-label="Your wizard" role="img" class="${mini?'avatar-svg avatar-mini':'avatar-svg'}" viewBox="0 0 230 265"><ellipse cx="115" cy="246" rx="66" ry="12" fill="#12122a" opacity=".35"/><path d="M76 167 Q111 147 154 164 L178 237 Q116 254 50 235Z" fill="${rc}" stroke="#181e49" stroke-width="5"/><path d="M107 162 L116 236 L125 162" fill="#eac6ff" opacity=".8"/><path d="M78 179 L44 209 Q35 217 45 225 Q57 228 64 217 L96 195Z" fill="${rc}"/><path d="M153 180 L185 211 Q194 216 188 227 Q177 234 166 218 L136 197Z" fill="${rc}"/><circle cx="51" cy="220" r="10" fill="${face}"/><circle cx="181" cy="221" r="10" fill="${face}"/><path d="M63 237 L64 249 L88 249 L95 235 M135 237 L143 249 L165 249 L169 234" fill="#41336a" stroke="#292247" stroke-width="5"/><circle cx="115" cy="108" r="47" fill="${face}" stroke="#272044" stroke-width="4"/><path d="M84 110 Q92 102 101 111 M129 111 Q138 102 146 111" stroke="#303146" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="94" cy="111" r="3" fill="#fff"/><circle cx="138" cy="111" r="3" fill="#fff"/><path d="M108 130 Q115 137 123 130" stroke="#985a6a" stroke-width="3" fill="none" stroke-linecap="round"/>${hairShapes[style]||hairShapes[0]}<path d="M186 215 L213 101" stroke="#7f5b3b" stroke-width="7" stroke-linecap="round"/><circle cx="216" cy="93" r="13" fill="#ffe480"/><path d="M216 66 L221 80 L235 86 L222 91 L217 106 L212 92 L199 86 L210 80Z" fill="#fff7c1"/><path d="M72 182 Q110 197 155 182" fill="none" stroke="#fff" opacity=".2" stroke-width="4"/></svg>`}
function header(){return `<header class="top"><div class="brand"><div class="logo">✨</div><div><div class="eyebrow">A magical math adventure</div><h1>Jack's Magic Battles <span class="versionlabel">✨ Animated!</span></h1></div></div><div class="stats"><div class="chip">⚔️ Battles <b>${S.completed}</b></div><div class="chip">⭐ Level <b>${S.level}</b></div><div class="chip">👑 Bosses <b>${S.bossWins}</b></div></div></header>`}
function toolbar(){if(!S.started)return '';return `<div class="sectionnav"><button class="btn ghost smallbtn" data-do="home">🏠 Adventure</button><button class="btn ghost smallbtn" data-do="map">🗺️ World Map</button><button class="btn ghost smallbtn" data-do="pets">🐾 Pet Helpers (${S.equipped.length}/2)</button><button class="btn teal smallbtn" data-do="export">💾 Backup Save</button><button class="btn ghost smallbtn" data-do="settings">⚙️ Settings</button></div>`}
function sidebar(){const pets=S.equipped.map(i=>S.pets.find(p=>p.id===i)).filter(Boolean);return `<aside class="rightcol"><section class="panel"><div class="eyebrow">YOUR WIZARD</div><div class="row">${avatarSVG(S.avatar,true)}<div><h3>${escapeHtml(S.avatar.name||'Jack')}</h3><div class="tiny">Level ${S.level} • Spellcaster</div><div class="tiny">🗡️ Power ${power()}<br>🛡️ Armor ${S.armor}</div></div></div><div class="healthtxt"><span>❤️ Health</span><span class="number">${S.hp.toLocaleString()}/${S.maxHp.toLocaleString()}</span></div><div class="progresswrap"><div class="progressfill" style="width:${Math.max(0,100*S.hp/S.maxHp)}%"></div></div><div style="height:17px"></div><div class="eyebrow">EQUIPPED PET HELPERS</div><div class="helperpills">${pets.length?pets.map(p=>`<span class="helperpill">${p.emoji} ${escapeHtml(p.name)}</span>`).join(''):'<span class="tiny">Defeat monsters to collect pets!</span>'}</div></section><section class="panel"><div class="eyebrow">WORLD PROGRESS</div><h3>${ZONES[S.zone].emoji} ${ZONES[S.zone].name}</h3><p class="small">Every 3rd battle is a boss! Every 5 boss wins unlocks another world.</p><div class="healthtxt"><span>Next new world</span><span>${Math.min(5,S.bossWins%5)}/5 bosses</span></div><div class="progresswrap"><div class="progressfill" style="width:${S.zone===3?100:(S.bossWins%5)*20}%;background:linear-gradient(90deg,#77efb1,#87dffa)"></div></div>${S.zone===3?'<p class="small">♾️ Endless mode unlocked!</p>':''}</section></aside>`}
function swatches(key,colors){return `<div class="swatches">${colors.map((c,i)=>`<button aria-label="${key} color ${i+1}" title="${key} color ${i+1}" class="swatch ${S.avatar[key]===i?'selected':''}" data-do="choose" data-key="${key}" data-value="${i}" style="background:${c}"></button>`).join('')}</div>`}
function creator(){return `<div class="panel wide"><span class="tag">🪄 STEP 1 · DESIGN YOUR HERO</span><div class="herohead"><h2>Create your magical character!</h2><p>Pick your look, name your wizard, and begin your adventure.</p></div><div class="creatorgrid"><div><div class="avatararea"><span class="star">✦</span><span class="star">✦</span><span class="star">✦</span>${avatarSVG(S.avatar)}</div><label class="formlabel" for="hero-name">YOUR WIZARD NAME</label><input id="hero-name" class="nameinput" maxlength="16" value="${escapeHtml(S.avatar.name)}" placeholder="Name your wizard"/></div><div><label class="formlabel">CHOOSE SKIN COLOR</label>${swatches('skin',SKINS)}<label class="formlabel">HAIR STYLE</label><div class="row">${STYLES.map((v,i)=>`<button class="stylepick ${i===S.avatar.style?'selected':''}" data-do="choose" data-key="style" data-value="${i}">${v}</button>`).join('')}</div><label class="formlabel">HAIR COLOR</label>${swatches('hair',HAIRS)}<label class="formlabel">WIZARD ROBE COLOR</label>${swatches('robe',ROBES)}<div class="buttonrow"><button class="btn" data-do="start">✨ Start Adventure!</button></div></div></div><div class="safe-box" style="margin-top:22px"><h3>💾 Already have an adventure?</h3><p>Keep your levels, pet helpers and equipment! Restore your original save instead of starting again.</p><div class="row"><label for="import-file" class="btn teal smallbtn" style="cursor:pointer;display:inline-flex;align-items:center">⬆️ Restore Save File</label><input id="import-file" class="filepick" type="file" accept=".json,application/json"/></div><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:800">Or paste your old saved game text</summary><textarea class="save-paste" id="save-paste" placeholder="Paste save JSON from Dad's backup"></textarea><button class="btn teal smallbtn" data-do="paste-save">Restore My Adventure</button></details></div></div>`}
function tutorial(){return `<section class="panel"><span class="tag">🕯️ THE BEGINNING</span><h2>Welcome to the Magic Cave!</h2><p class="story">A tiny lantern flickers. A friendly wizard appears in front of you...</p><div class="avatararea" style="background:radial-gradient(circle,#6453a880,transparent 60%),linear-gradient(150deg,#2b293d,#151a34)"><span class="star">✧</span><span class="star">✦</span><span style="font-size:100px">🧙‍♂️</span></div><div class="banner"><strong>Grandmaster Glimmer:</strong> “Hello, ${escapeHtml(S.avatar.name)}! To cast a spell, solve a math problem. You can try as many times as you want, and each mistake makes the next challenge 1% easier. Let's practice!”</div><div class="buttonrow"><button class="btn" data-do="practice">🪄 Try a practice battle</button></div></section>`}
function power(){return Math.floor(125+S.level*73+S.attackBonus)}
function unlocked(){return Math.min(3,Math.floor(S.bossWins/5))}
function tryFight(isPractice=false){if(isPractice&&!S.tutorialDone){}else if(!S.tutorialDone){S.screen='tutorial';render();return;}const isBoss=!isPractice&&(S.completed+1)%3===0;const z=ZONES[S.zone];let [name,emoji]=isPractice?['Training Slime','🫧']:isBoss?z.boss:z.enemies[rand(0,z.enemies.length-1)];const nextBoss=S.bossWins;const hp=isPractice?105:isBoss?Math.min(100000,Math.round(1000*Math.pow(1.39,nextBoss)+S.level*35)):Math.max(220,Math.round(180+S.level*135+(S.zone*125)));const attack=isPractice?14:Math.floor((22+S.level*17+S.zone*12)*(isBoss?1.2:1));S.battle={name,emoji,isBoss,isPractice,hp,maxHp:hp,attack,turn:0,feed:`${emoji} ${name} attacks first! Now it's your turn.`,lastHit:false};S.tries=0;S.question=makeQuestion();S.screen='battle';opponentAttack(true);save();render();setTimeout(playEnemyAnimation,110);}
function makeQuestion(){const scale=Math.pow(.99,Math.min(300,S.tries));const tier=Math.min(8,Math.max(0,Math.floor((S.level-1)/5)));const high=Math.max(4,Math.floor((12+tier*6)*scale));const op=(tier>=3&&Math.random()<.28)?'×':(Math.random()<.45?'-':'+');let a,b;if(op==='×'){a=rand(2,Math.max(3,Math.floor((3+tier)*scale)));b=rand(2,Math.max(3,Math.floor((3+tier)*scale)))}else{a=rand(2,high);b=rand(1,high);if(op==='-'&&b>a)[a,b]=[b,a]}return{a,b,op,answer:op==='+'?a+b:op==='-'?a-b:a*b}}
function opponentAttack(first=false){if(!S.battle)return;let d=Math.max(3,S.battle.attack-S.armor);S.hp=Math.max(1,S.hp-d);if(first)S.battle.feed=`${S.battle.emoji} ${S.battle.name} strikes for ${d} damage! Your turn: solve the math problem.`;else S.battle.feed=`The monster hits back for ${d}! Your turn again.`;}
function mathSubmit(){
 if(animating||S.screen!=='battle'||!S.question)return;
 const input=document.getElementById('answer');if(!input)return;
 const raw=input.value.trim();if(!raw){toast('Type your answer first! ✏️');return;}
 const guess=Number(raw);if(!Number.isFinite(guess)){toast('Use numbers to cast spells!');return;}
 S.totalAnswered++;
 if(guess!==S.question.answer){
   S.tries++;S.question=makeQuestion();
   S.battle.feed=`Keep going, ${S.avatar.name}! The next challenge is 1% easier. You have unlimited tries. 💙`;
   save();render();setTimeout(()=>document.getElementById('answer')?.focus(),35);return;
 }
 const b=S.battle;let hit=power();let assists=[];
 for(const id of S.equipped){const p=S.pets.find(x=>x.id===id);
  if(p&&b.turn%2===1){const damage=Math.floor(p.strength+S.level*14);hit+=damage;assists.push(`${p.emoji} ${p.name} used ${p.special} for ${damage}!`)}
 }
 b.hp=Math.max(0,b.hp-hit);b.turn++;S.tries=0;
 // Save immediately, before the animation starts; a closed tab cannot erase the victory.
 if(b.hp<=0){wonBattle(assists,hit,true);animating=true;playSpellAnimation(hit,assists.length,()=>{animating=false;render()});return;}
 S.question=makeQuestion();opponentAttack();
 b.feed=`✨ Correct! Your spell dealt ${hit} damage! ${assists.join(' ')} ${b.feed}`;
 save();animating=true;
 playSpellAnimation(hit,assists.length,()=>{animating=false;render();setTimeout(()=>{playEnemyAnimation();document.getElementById('answer')?.focus()},90)});
}
function recruit(b){const pet={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:b.name,emoji:b.emoji,level:S.level,strength:Math.round(power()*(b.isBoss?.95:.45)),special:b.isBoss?'Meteor Burst':(S.zone===0?'Leaf Beam':S.zone===1?'Flame Wave':S.zone===2?'Thunder Flash':'Star Storm')};S.pets.push(pet);if(S.equipped.length<2)S.equipped.push(pet.id);S.lastRecruit=pet;}
function wonBattle(assists,hit,deferRender=false){const b=S.battle;S.completed+=b.isPractice?0:1;S.level+=b.isPractice?0:1;S.maxHp+=b.isPractice?0:100;S.hp=S.maxHp;S.notice=b.isPractice?`You passed training! Grandmaster Glimmer opens the forest gate.`:`Your attack hit for ${hit}! ${assists.join(' ')} Victory! +1 level and +100 maximum health!`;if(!b.isPractice){recruit(b);if(b.isBoss)S.bossWins++}else S.tutorialDone=true;S.battle=null;S.question=null;S.screen=b.isBoss?'reward':'victory';save();if(!deferRender)render();}
function battle(){
 const b=S.battle;if(!b){S.screen='adventure';save();return adventure()}
 const zoneClass=['forest','volcano','sky','endless'][S.zone]||'forest';
 const props=[['🌲','🍄','✨'],['🔥','🪨','🌋'],['☁️','🌈','⭐'],['🪐','🌟','✨']][S.zone];
 const team=S.equipped.map(id=>S.pets.find(p=>p.id===id)).filter(Boolean);
 return `<section class="panel"><span class="tag">${b.isPractice?'🕯️ CAVE PRACTICE':b.isBoss?'👑 BOSS BATTLE':'⚔️ MAGIC BATTLE '+(S.completed+1)}</span><h2>${b.isBoss?'Big Boss: ':''}${escapeHtml(b.name)}</h2><p>${b.isPractice?'This is a friendly practice fight.':b.isBoss?'A powerful boss appears! Defeat it to choose a special reward.':'Defeat this creature and add it to your Pet Helpers collection!'}</p>
 <div id="battle-arena" class="arena-scene ${b.isPractice?'endless':zoneClass}" aria-label="Animated magic battle between your wizard and ${escapeHtml(b.name)}">
   <div class="arena-scenery" aria-hidden="true"><span class="object">${props[0]}</span><span class="object">${props[1]}</span><span class="object">${props[2]}</span></div>
   <div class="arena-vs">⚡ VS ⚡</div>
   <div id="player-actor" class="actor player-actor">${avatarSVG(S.avatar,true)}</div>
   <div id="battle-pets" class="arena-pets" aria-label="Your helpers">${team.map(p=>`<span title="${escapeHtml(p.name)}">${p.emoji}</span>`).join('')}</div>
   <div id="enemy-actor" class="actor enemy-actor ${b.isBoss?'boss-actor':''}"><span class="beast" role="img" aria-label="${escapeHtml(b.name)}">${b.emoji}</span></div>
   <span class="arena-name left">🪄 ${escapeHtml(S.avatar.name)}</span><span class="arena-name right">${b.emoji} ${escapeHtml(b.name)}</span>
   <div id="spell-projectile" class="arena-projectile" aria-hidden="true"></div>
   <div id="battle-damage" class="arena-damage" aria-live="polite"></div>
 </div>
 <div class="battle-hp"><div class="hp-card"><div class="healthtxt"><span>❤️ YOUR HEALTH</span><span>${S.hp.toLocaleString()}/${S.maxHp.toLocaleString()}</span></div><div class="progresswrap"><div class="progressfill" style="width:${100*S.hp/S.maxHp}%;background:linear-gradient(90deg,#7ee8ad,#a2f0ca)"></div></div></div>
 <div class="hp-card"><div class="healthtxt"><span>❤️ MONSTER HP</span><span>${b.hp.toLocaleString()}/${b.maxHp.toLocaleString()}</span></div><div class="progresswrap"><div class="progressfill" style="width:${100*b.hp/b.maxHp}%"></div></div></div></div>
 <div class="feedback" aria-live="polite">${escapeHtml(b.feed)}</div><div class="spellcard"><h3>✨ Your turn — cast a math spell!</h3><div class="equation">${S.question.a} ${S.question.op} ${S.question.b} = ?</div><form id="math-form" class="spellrow"><input required autofocus id="answer" name="answer" class="mathinput" type="number" inputmode="numeric" placeholder="?" autocomplete="off" aria-label="Your math answer"/><button class="btn" type="submit">🪄 Cast Spell!</button></form>${S.tries?`<div class="feedback hint">💡 Difficulty adjusted: <b>${Math.max(0,100-S.tries)}%</b> of original. ${hint()} Every wrong answer makes the next question about 1% easier. Keep trying!</div>`:'<p class="small" style="text-align:center">There is no penalty for a wrong answer. You can try again! 💙</p>'}</div><p class="tiny">Your spell power: ${power()}. Equipped pets use their special spells every second correct answer.</p></section>`;
}
function playSpellAnimation(damage,withPets,done){
 const arena=document.getElementById('battle-arena'),hero=document.getElementById('player-actor');
 if(!arena||!hero){done();return;}
 const enemy=document.getElementById('enemy-actor'),orb=document.getElementById('spell-projectile'),pop=document.getElementById('battle-damage');
 document.getElementById('answer')?.setAttribute('disabled','disabled');document.querySelector('#math-form button')?.setAttribute('disabled','disabled');
 hero.classList.add('casting');orb?.classList.add('flying');arena.classList.add('spell-flash');
 if(withPets)document.getElementById('battle-pets')?.classList.add('helping');
 setTimeout(()=>{enemy?.classList.add('struck');if(pop){pop.textContent='−'+damage.toLocaleString()+' ✨';pop.classList.add('show')}playTone('cast')},230);
 setTimeout(done,920);
}
function playEnemyAnimation(){
 const arena=document.getElementById('battle-arena');if(!arena)return;
 const e=document.getElementById('enemy-actor'),p=document.getElementById('player-actor');
 const orb=document.getElementById('spell-projectile'),pop=document.getElementById('battle-damage');
 e?.classList.add('lunging');if(orb)orb.classList.add('enemybolt');
 setTimeout(()=>{p?.classList.add('hurt');if(pop){pop.textContent='⚡';pop.classList.add('incoming','show')}},260);
 setTimeout(()=>{e?.classList.remove('lunging');p?.classList.remove('hurt');orb?.classList.remove('enemybolt');pop?.classList.remove('incoming','show')},820)
}
function playTone(type){
 if(!S.soundOn)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const ctx=new Audio(),o=ctx.createOscillator(),gain=ctx.createGain();
 o.type='sine';o.frequency.setValueAtTime(type==='cast'?500:330,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(type==='cast'?870:580,ctx.currentTime+.19);
 gain.gain.setValueAtTime(.035,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(gain).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3);o.onended=()=>ctx.close();
 }catch(e){}
}
function hint(){const q=S.question;return q.op==='+'?'Hint: Try starting with the bigger number and counting up.':q.op==='-'?'Hint: Count backwards from the first number.':'Hint: Multiplication means equal groups. Try counting groups!'}
function adventure(){const z=ZONES[S.zone];return `<section class="panel"><span class="tag">${z.emoji} WORLD ${S.zone===3?'♾️ ENDLESS':S.zone+1+' OF 3'}</span><h2>Explore ${z.name}!</h2><p class="story">${z.desc}</p><div class="avatararea" style="background:${z.bg}"><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span style="font-size:105px">${z.emoji}</span></div><div class="banner"><strong>${S.zone===3?'Never-ending adventure!':'Your quest:'}</strong> ${S.zone===3?'Keep battling as long as you want. Your total battles stay on top!':`Beat monsters to level up. Battle ${S.completed+1} is ${((S.completed+1)%3===0)?'a BOSS':'a regular opponent'}. Every third battle, face a boss.`}</div><div class="buttonrow"><button class="btn" data-do="fight">⚔️ Start Battle ${S.completed+1}</button><button class="btn purple" data-do="map">🗺️ World Map</button></div></section>`}
function victory(){const p=S.lastRecruit;const newZone=unlocked();return `<section class="panel"><span class="tag">🎊 ${S.tutorialDone&&S.completed===0?'TRAINING COMPLETE':'YOU WON!'}</span><div class="levelburst">✨🌟✨</div><h2>${S.completed===0?'The forest awaits!':'Level '+S.level+'! Incredible!'}</h2><p class="story">${escapeHtml(S.notice)}</p>${p?`<div class="banner">🐾 New magical helper recruited: <strong>${p.emoji} ${escapeHtml(p.name)}</strong>! ${S.equipped.includes(p.id)?'Automatically added to your team.':'Find it in Pet Helpers.'}</div>`:''}<div class="menuitems"><div class="menuitem"><span class="menuicon">💗</span><span>${S.completed===0?'Your health is full!':`Maximum health increased to ${S.maxHp.toLocaleString()}!`}</span></div><div class="menuitem"><span class="menuicon">✨</span><span>Next attack power: ${power().toLocaleString()}</span></div></div>${newZone>S.zone?`<div class="banner">🔓 NEW WORLD UNLOCKED: ${ZONES[newZone].emoji} ${ZONES[newZone].name}!</div>`:''}<div class="buttonrow"><button class="btn" data-do="continue">${newZone>S.zone?'🗺️ See New World':'⚔️ Continue Adventure'}</button><button class="btn purple" data-do="pets">🐾 Pet Helpers</button></div></section>`}
function getRewards(){const t=S.level;const tier=Math.floor(S.bossWins/5)+1;return[{id:'blade',emoji:'⚔️',name:`Starlight Sword +${tier}`,desc:`Add ${Math.floor(90+t*22)} power to every math spell!`,value:Math.floor(90+t*22)}, {id:'armor',emoji:'🛡️',name:`Moonstone Armor +${tier}`,desc:`Block ${Math.floor(12+t*6)} damage from each monster strike.`,value:Math.floor(12+t*6)}, {id:'heart',emoji:'💎',name:`Heart Crystal +${tier}`,desc:`Gain ${100+t*12} extra maximum health forever!`,value:100+t*12}]}
function reward(){return `<section class="panel"><span class="tag">👑 BOSS DEFEATED!</span><div class="levelburst">🏆</div><h2>Choose ONE amazing reward!</h2><p>Each boss drops stronger gear as you level up. Pick the reward you like best.</p><div class="banner">✨ Level ${S.level} reached! +100 maximum health. 🐾 You also recruited ${S.lastRecruit?.emoji||''} ${escapeHtml(S.lastRecruit?.name||'a helper')}!</div><div class="rewardgrid">${getRewards().map(r=>`<article class="reward"><div class="big">${r.emoji}</div><strong>${escapeHtml(r.name)}</strong><p>${escapeHtml(r.desc)}</p><button class="btn smallbtn" data-do="reward" data-value="${r.id}">Choose ${r.emoji}</button></article>`).join('')}</div>${unlocked()>S.zone?`<div class="banner">🔓 ${ZONES[unlocked()].emoji} A new world is unlocked, too!</div>`:''}</section>`}
function worldmap(){const gate=unlocked();return `<section class="panel"><span class="tag">🗺️ THE MAGIC WORLD</span><h2>Your Adventure Map</h2><p>Defeat five bosses to unlock each new world. After all three story worlds comes an endless challenge!</p><div class="mapgrid"><article class="mapitem"><div class="mapicon">🕯️</div><div><h3>Training Cave ✅</h3><p class="small">Your first math spell. Training complete!</p></div></article>${ZONES.map((z,i)=>`<article class="mapitem ${i===S.zone?'active':''} ${i>gate?'locked':''}"><div class="mapicon">${i>gate?'🔒':z.emoji}</div><div style="flex:1"><h3>${escapeHtml(z.name)} ${i===S.zone?'📍':''}</h3><p class="small">${escapeHtml(z.desc)}</p>${i>gate?`<div class="tiny">Unlock after ${i*5} boss victories (${S.bossWins}/${i*5})</div>`:`<button class="btn ${i===S.zone?'ghost':'teal'} smallbtn" data-do="travel" data-value="${i}">${i===S.zone?'Current World':'Travel Here ✨'}</button>`}</div></article>`).join('')}</div><div class="buttonrow"><button class="btn purple" data-do="home">← Back to Adventure</button></div></section>`}
function pets(){return `<section class="panel"><span class="tag">🐾 YOUR MAGIC COLLECTION</span><h2>Pet Helpers</h2><p>You can equip <b>two</b> magic helpers. Each has a powerful special attack. Defeat new monsters to collect them all!</p><div class="banner">Equipped: <b>${S.equipped.length} of 2</b> • Collected: ${S.pets.length} creatures</div><div class="petlist">${S.pets.length?S.pets.map(p=>`<article class="petitem"><span class="peticon">${p.emoji}</span><div style="flex:1"><h3>${escapeHtml(p.name)}</h3><div class="tiny">Level ${p.level} • ${escapeHtml(p.special)} • Power ${Math.round(p.strength+S.level*14)}</div></div><button class="btn ${S.equipped.includes(p.id)?'ghost':'teal'} smallbtn" data-do="equip" data-value="${p.id}">${S.equipped.includes(p.id)?'✓ Equipped':'Equip'}</button></article>`).join(''):'<p>Once you win your first real battle, your new pet will appear here!</p>'}</div><div class="buttonrow"><button class="btn purple" data-do="home">← Back</button></div></section>`}
function settings(){return `<section class="panel"><span class="tag">⚙️ PREFERENCES</span><h2>Game Settings & Save Safety</h2><p>Your adventure automatically saves in this Chrome browser, on this device. Download a backup before changing files, browsers, or computers.</p>
 <div class="banner">⭐ Level ${S.level} • ⚔️ ${S.completed} battles • 🐾 ${S.pets.length} pets • 👑 ${S.bossWins} bosses</div>
 <section class="safe-box"><h3>💾 Back Up Your Adventure</h3><p>This downloads a small save file containing your level, pets, equipment, and character. Keep it safe with your dad.</p><div class="row"><button class="btn teal" data-do="export">⬇️ Download My Save</button><label for="import-file" class="btn purple" style="cursor:pointer;display:inline-flex;align-items:center">⬆️ Restore a Save</label><input id="import-file" class="filepick" type="file" accept=".json,application/json"/></div>
 <p class="backup-status">✅ Works with saves from the original Jack's Magic Battles. Importing never deletes the backup file.</p>
 <details><summary style="cursor:pointer;font-weight:850;padding:8px 0">Have save text from the original Chrome tab?</summary><p>Paste the saved JSON below. Ask Dad for help if needed.</p><textarea class="save-paste" id="save-paste" placeholder="Paste the original save JSON here"></textarea><button class="btn teal smallbtn" data-do="paste-save">✨ Restore Pasted Save</button></details>
 </section><div class="row"><button class="btn ghost smallbtn" data-do="sound">${S.soundOn?'🔊 Sound: On':'🔇 Sound: Off'}</button></div>
 <div class="buttonrow"><button class="btn purple" data-do="home">← Keep Playing</button><button class="btn ghost" data-do="reset">🗑️ Reset My Adventure</button></div><p class="tiny danger">Reset erases this browser's progress. Download a backup before using it.</p></section>`}
function downloadSave(){
 try{save();const text=JSON.stringify({game:'jacks-magic-battles',format:1,exportedAt:new Date().toISOString(),save:S},null,2);
 const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jacks-magic-battles-save-level-${S.level}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Your adventure backup is downloading! 💾');}
 catch(e){toast('Could not download. Try Chrome on your computer.')}
}
function validateSave(obj){
 const value=obj?.game==='jacks-magic-battles'&&obj.save?obj.save:obj;
 if(!value||typeof value!=='object'||Array.isArray(value)||!value.avatar||typeof value.avatar.name!=='string'||!Number.isInteger(value.level)||value.level<1||value.level>100000||!Number.isInteger(value.completed)||value.completed<0||value.completed>1000000||!Array.isArray(value.pets)||value.pets.length>30000||!Array.isArray(value.equipped)||!Array.isArray(value.loot)||!Number.isInteger(value.bossWins)||value.bossWins<0||value.bossWins>1000000)throw Error('This file does not look like a Jack’s Magic Battles save.');
 const clean={...INITIAL(),...value,avatar:{...INITIAL().avatar,...value.avatar}};
 clean.avatar.name=String(clean.avatar.name).slice(0,16);
 clean.zone=Number.isInteger(clean.zone)?Math.max(0,Math.min(3,clean.zone)):0;
 clean.screen=['creator','tutorial','battle','victory','reward','map','pets','settings','adventure'].includes(clean.screen)?clean.screen:'adventure';
 if(clean.screen==='battle'&&(!clean.battle||!clean.question))clean.screen='adventure';
 clean.equipped=clean.equipped.filter(x=>clean.pets.some(p=>p.id===x)).slice(0,2);
 return clean;
}
function importSave(text){
 try{if(text.length>5_000_000)throw Error('Save too large.');const candidate=validateSave(JSON.parse(text));
 if(S.started&&!window.confirm(`Restore ${candidate.avatar.name}'s Level ${candidate.level} adventure? This will replace this browser's current Level ${S.level} save. Download a backup first if you want to keep both.`))return;
 S=candidate;save();render();toast(`Save restored! Welcome back, ${S.avatar.name}! ⭐`);
 }catch(e){toast('Could not restore: '+e.message);}
}
function render(){let main;if(!S.started)main=creator();else if(S.screen==='tutorial')main=tutorial();else if(S.screen==='battle')main=battle();else if(S.screen==='victory')main=victory();else if(S.screen==='reward')main=reward();else if(S.screen==='map')main=worldmap();else if(S.screen==='pets')main=pets();else if(S.screen==='settings')main=settings();else main=adventure();el().innerHTML=header()+(S.started?`<div style="margin-bottom:16px">${toolbar()}</div>`:'')+`<main class="layout">${main}${S.started?sidebar():''}</main><div class="footnote">Made for Jack 💜 • Animated Adventure v2 • Same original save format • Backup in Settings</div>`;}
function goHome(){if(S.battle){S.screen='battle'}else if(!S.tutorialDone){S.screen='tutorial'}else if(S.screen==='reward'){return}else S.screen='adventure';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do,v=b.dataset.value;switch(a){case'choose':{const key=b.dataset.key;if(!['skin','hair','style','robe'].includes(key))return;S.avatar[key]=Number(v);const i=document.getElementById('hero-name');if(i)S.avatar.name=i.value.slice(0,16)||'Jack';save();render();break}case'start':{const i=document.getElementById('hero-name');S.avatar.name=(i?.value.trim()||'Jack').slice(0,16);S.started=true;S.screen='tutorial';save();render();break}case'practice':tryFight(true);break;case'fight':tryFight(false);break;case'home':goHome();break;case'map':S.screen='map';save();render();break;case'pets':S.screen='pets';save();render();break;case'settings':S.screen='settings';save();render();break;case'continue':S.screen=unlocked()>S.zone?'map':'adventure';save();render();break;case'travel':{const i=Number(v);if(i>unlocked()){toast('Beat more bosses to unlock that place!');break}if(S.battle){toast('Finish your current battle first!');S.screen='battle';render();break}S.zone=i;S.screen='adventure';save();render();break}case'equip':{const id=v;if(!S.pets.some(p=>p.id===id))return;const at=S.equipped.indexOf(id);if(at>=0)S.equipped.splice(at,1);else if(S.equipped.length<2)S.equipped.push(id);else {toast('You can equip only 2 pets! Unequip one first.');return}save();render();break}case'reward':{if(S.screen!=='reward')return;const r=getRewards().find(x=>x.id===v);if(!r)return;if(r.id==='blade')S.attackBonus+=r.value;else if(r.id==='armor')S.armor+=r.value;else if(r.id==='heart'){S.maxHp+=r.value;S.hp=S.maxHp}S.loot.push({name:r.name,id:r.id,value:r.value});S.notice=`You earned ${r.name}! Your next magical adventure awaits.`;S.screen='victory';save();render();break}case'export':downloadSave();break;case'paste-save':{importSave(document.getElementById('save-paste')?.value.trim()||'');break}case'sound':S.soundOn=!S.soundOn;save();render();break;case'reset':{if(window.confirm('Reset the entire adventure? Your levels, pets, and gear will disappear.')){S=INITIAL();save();render()};break}}});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;try{if(file.size>5000000)throw Error('File is too large.');importSave(await file.text())}catch(err){toast('Could not read save file: '+err.message)}e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='math-form'){e.preventDefault();mathSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='hero-name'){S.avatar.name=e.target.value.slice(0,16);save();}});
render();
})();
</script></body></html>
